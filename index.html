<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom | Lịch tổng quan</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-col { position: sticky; left: 0; z-index: 20; }
    .today-highlight-header { background-color: #e0f2fe !important; border-left: 2px solid #38bdf8 !important; border-right: 2px solid #38bdf8 !important; }
    .today-highlight-cell { background-color: #f0f9ff !important; border-left: 2px solid #bae6fd !important; border-right: 2px solid #bae6fd !important; }
  </style>

  <style id="lms-design-system">
    :root{color-scheme:light;--lms-accent:#0284c7;--lms-accent-dark:#075985;--lms-border:#dbeafe;--lms-muted:#64748b;--lms-bg:#f3f9ff}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--lms-bg);color:#172033;letter-spacing:-.01em}
    button,a,input,select,textarea{transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
    input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(14,165,233,.16);border-color:#0ea5e9!important}
    .rounded-2xl{border-radius:1rem}
    ::selection{background:#e0f2fe;color:#075985}
    ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
  </style>

</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative">

  <!-- NÚT KHÓA BẢO MẬT GIÁO VIÊN -->
  <button onclick="toggleGlobalTeacherMode()" id="global-lock-btn" 
          class="fixed bottom-6 right-6 p-3 bg-sky-800 hover:bg-sky-900 text-white rounded-full transition-all z-50 shadow-lg flex items-center justify-center opacity-30 hover:opacity-100" 
          title="Mở khóa Giáo viên (0208)">
    <i data-lucide="lock" class="w-5 h-5" id="global-lock-icon"></i>
  </button>

  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-[1700px] mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-sky-600 flex items-center justify-center text-white"><i data-lucide="calendar" class="w-4 h-4"></i></div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold text-slate-900" id="header-week-label">Week 08</h1>
          <span id="current-week-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-800">Tuần này</span>
          <span class="text-xs text-slate-400">|</span>
          <p class="text-xs text-slate-500 font-medium" id="header-date-range">26.10 – 01.11</p>
        </div>
        <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 ml-1">
          <button onclick="changeWeek(-1)" class="p-1 hover:bg-white rounded transition text-slate-600"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
          <button onclick="goToCurrentWeek()" class="px-2 py-0.5 text-xs font-semibold text-slate-700 hover:bg-white rounded transition">Hiện tại</button>
          <button onclick="changeWeek(1)" class="p-1 hover:bg-white rounded transition text-slate-600"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        </div>
        <button onclick="copyToNextWeek()" class="teacher-feature hidden items-center gap-1 px-2.5 py-1 text-xs font-semibold text-sky-800 bg-sky-50 hover:bg-sky-100 rounded-lg transition border border-sky-200">
          <i data-lucide="copy" class="w-3.5 h-3.5 text-sky-600"></i><span>Nhân bản sang tuần sau</span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2 text-slate-400"></i>
          <input type="text" id="search-input" oninput="renderTable()" placeholder="Tìm lớp..." class="pl-8 pr-2.5 py-1 text-xs bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-sky-500 w-36 sm:w-44">
        </div>
        <button onclick="addNewClass()" class="teacher-feature hidden items-center gap-1 px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5 text-sky-600"></i><span>Thêm lớp</span>
        </button>
        <button onclick="openSheetModal()" class="teacher-feature hidden items-center gap-1 px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition">
          <i data-lucide="sheet" class="w-3.5 h-3.5 text-sky-700"></i><span>Google Sheet</span>
        </button>
        <button onclick="exportCSV()" class="p-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg border border-slate-300 transition"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1700px] w-full mx-auto p-3 overflow-hidden flex flex-col">
    <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden flex flex-col flex-1">
      <div class="overflow-x-auto overflow-y-auto max-h-[calc(100vh-100px)]">
        <table class="w-full border-collapse text-left min-w-[1050px] table-fixed">
          <thead>
            <tr class="bg-[#285f83] text-white">
              <th class="p-2 text-xs font-bold uppercase tracking-wider sticky-col bg-[#285f83] w-48 border-r border-[#3b789f]">CLASS</th>
              <th colspan="7" class="p-1.5 text-center text-xs font-semibold tracking-wide border-b border-[#3b789f]">
                <div class="inline-flex items-center gap-2 px-3 py-0.5 bg-[#1d4f70] rounded-full">
                  <i data-lucide="calendar-days" class="w-3.5 h-3.5 text-sky-300"></i><span id="banner-week-title">Week 08 • 26.10–01.11</span>
                </div>
              </th>
            </tr>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs font-medium">
              <th class="p-1.5 sticky-col bg-slate-100 border-r border-slate-200 text-center text-slate-400 font-normal w-48"></th>
              <th id="th-day-0" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Mon</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-0">26/10</div></th>
              <th id="th-day-1" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Tue</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-1">27/10</div></th>
              <th id="th-day-2" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Wed</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-2">28/10</div></th>
              <th id="th-day-3" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Thu</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-3">29/10</div></th>
              <th id="th-day-4" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Fri</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-4">30/10</div></th>
              <th id="th-day-5" class="p-1.5 text-center border-r border-slate-200 transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Sat</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-5">31/10</div></th>
              <th id="th-day-6" class="p-1.5 text-center transition-colors"><div class="font-bold text-slate-900 flex items-center justify-center gap-1"><span>Sun</span><span class="today-tag hidden text-[9px] bg-sky-600 text-white px-1 rounded">Nay</span></div><div class="text-[11px] text-slate-500" id="date-label-6">01/11</div></th>
            </tr>
          </thead>
          <tbody id="timetable-body" class="divide-y divide-slate-200 text-xs"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="link-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 border border-slate-200">
      <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-100">
        <h4 class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
          <i data-lucide="link" class="w-3.5 h-3.5 text-sky-600"></i><span id="modal-class-title">Link lớp</span>
        </h4>
        <button onclick="closeLinkModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-2">
        <input type="text" id="modal-class-name" placeholder="Tên lớp..." class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-sky-500 outline-none">
        <input type="text" id="modal-class-url" placeholder="VD: ac01.html hoặc link riêng" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-sky-500 outline-none">
      </div>
      <div class="flex justify-end gap-2 mt-3">
        <button onclick="closeLinkModal()" class="px-2.5 py-1 text-xs text-slate-500 hover:bg-slate-100 rounded-lg">Đóng</button>
        <button onclick="saveClassLink()" class="px-3 py-1 text-xs font-semibold bg-sky-600 text-white rounded-lg">Lưu</button>
      </div>
    </div>
  </div>

  <script>
    const TEACHER_PIN = "0208";
    let isTeacherUnlocked = false;

    function toggleGlobalTeacherMode() {
      if (isTeacherUnlocked) {
        isTeacherUnlocked = false;
        document.getElementById('global-lock-icon').setAttribute('data-lucide', 'lock');
        document.querySelectorAll('.teacher-feature').forEach(el => el.classList.add('hidden'));
        alert("Đã khóa chế độ chỉnh sửa.");
      } else {
        const pin = prompt("Nhập mã PIN Giáo viên:");
        if (pin === TEACHER_PIN) {
          isTeacherUnlocked = true;
          document.getElementById('global-lock-icon').setAttribute('data-lucide', 'unlock');
          document.querySelectorAll('.teacher-feature').forEach(el => el.classList.remove('hidden'));
          alert("Đã mở khóa tính năng chỉnh sửa!");
        } else if (pin !== null) {
          alert("Mã PIN không đúng!");
        }
      }
      lucide.createIcons();
    }

    const initialWeek7Data = [
      { id: "free", name: "Lịch rảnh", isSpecial: true, type: "free", schedule: ["", "", "", "", "", "", ""] },
      { id: "blocked", name: "Blocked", isSpecial: true, type: "blocked", schedule: ["07:00 - 22:30", "08:00 - 17:00", "08:00 - 17:00", "08:00 - 17:00", "08:00 - 19:00", "20:30 - 22:00", "18:00 - 22:30"] },
      { id: "c1", name: "AC07", schedule: ["", "", "", "", "", "13:00 - 14:30", "16:00 - 17:30"] }
    ];

    const BASE_WEEK_NUM = 1;
    const BASE_MONDAY = new Date(2026, 8, 7); // Week 01 starts Monday 07/09/2026 

    function getActualCurrentWeek() {
      const now = new Date();
      const day = (now.getDay() + 6) % 7;
      const currentMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
      const diffWeeks = Math.round((currentMonday.getTime() - BASE_MONDAY.getTime()) / (7 * 24 * 60 * 60 * 1000));
      return BASE_WEEK_NUM + diffWeeks;
    }

    const ACTUAL_CURRENT_WEEK = getActualCurrentWeek();
    let currentViewingWeek = ACTUAL_CURRENT_WEEK;
    let allWeeksSchedule = {}, acceptedConflicts = new Set(), pendingConflict = null, selectedEditingClassId = null;

    try {
      const savedStore = localStorage.getItem("all_weeks_schedule_data");
      if (savedStore) allWeeksSchedule = JSON.parse(savedStore);
    } catch(e){}
    if (!allWeeksSchedule[7]) allWeeksSchedule[7] = JSON.parse(JSON.stringify(initialWeek7Data));
    // Give every class a stable ID once; IDs stay unchanged when a class is renamed.
    function makeId(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
    function slugName(name) { return String(name || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
    Object.values(allWeeksSchedule).forEach(week => (week || []).forEach(row => {
      if (!row.isSpecial && !row.id) row.id = makeId('CLS');
      // Replace legacy auto-generated per-class pages with the new shared class template.
      if (!row.isSpecial && row.url && row.url === `${slugName(row.name)}.html`) row.url = '';
    }));
    if (Object.values(allWeeksSchedule).some(week => (week || []).some(row => !row.isSpecial && row.id))) localStorage.setItem('all_weeks_schedule_data', JSON.stringify(allWeeksSchedule));

    function getCurrentWeekSchedule() {
      if (!allWeeksSchedule[currentViewingWeek]) {
        allWeeksSchedule[currentViewingWeek] = initialWeek7Data.map(r => ({ ...r, schedule: r.type === "blocked" ? [...r.schedule] : ["", "", "", "", "", "", ""] }));
      }
      return allWeeksSchedule[currentViewingWeek];
    }

    function persist() {
      localStorage.setItem("all_weeks_schedule_data", JSON.stringify(allWeeksSchedule));
    }

    function getWeekDateRange(weekNum) {
      const diffWeeks = weekNum - BASE_WEEK_NUM;
      const monday = new Date(BASE_MONDAY);
      monday.setDate(monday.getDate() + (diffWeeks * 7));
      return Array.from({length: 7}, (_, i) => { const d = new Date(monday); d.setDate(d.getDate() + i); return d; });
    }

    function changeWeek(step) { currentViewingWeek += step; if (currentViewingWeek < 1) currentViewingWeek = 1; updateWeekUI(); renderTable(); }
    function goToCurrentWeek() { currentViewingWeek = ACTUAL_CURRENT_WEEK; updateWeekUI(); renderTable(); }

    function copyToNextWeek() {
      if (!isTeacherUnlocked) return alert("Vui lòng mở khóa Giáo viên (Icon ổ khóa góc dưới phải)!");
      const nextWeekNum = currentViewingWeek + 1;
      if (confirm(`Chép toàn bộ lịch sang Week ${nextWeekNum}?`)) {
        allWeeksSchedule[nextWeekNum] = JSON.parse(JSON.stringify(getCurrentWeekSchedule()));
        persist(); changeWeek(1);
      }
    }

    function editClassNameInline(rowIndex) {
      if (!isTeacherUnlocked) return alert("Vui lòng mở khóa Giáo viên (Icon ổ khóa góc dưới phải) để sửa tên!");
      const schedule = getCurrentWeekSchedule();
      const row = schedule[rowIndex];
      if (row.isSpecial) return;
      const newName = prompt("Nhập tên mới cho lớp:", row.name);
      if (newName && newName.trim() && newName.trim() !== row.name) {
        row.name = newName.trim();
        persist(); renderTable();
      }
    }

    function updateWeekUI() {
      const weekDays = getWeekDateRange(currentViewingWeek);
      const pad = (n) => n.toString().padStart(2, '0');
      const dateRangeStr = `${pad(weekDays[0].getDate())}.${pad(weekDays[0].getMonth()+1)} – ${pad(weekDays[6].getDate())}.${pad(weekDays[6].getMonth()+1)}`;
      const weekTitle = `Week ${pad(currentViewingWeek)}`;

      document.getElementById("header-week-label").textContent = weekTitle;
      document.getElementById("header-date-range").textContent = dateRangeStr;
      document.getElementById("banner-week-title").textContent = `${weekTitle} • ${dateRangeStr}`;
      document.getElementById("current-week-badge").classList.toggle("hidden", currentViewingWeek !== ACTUAL_CURRENT_WEEK);

      const today = new Date();
      weekDays.forEach((d, i) => {
        document.getElementById(`date-label-${i}`).textContent = `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
        const thEl = document.getElementById(`th-day-${i}`);
        const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
        thEl.classList.toggle("today-highlight-header", isToday);
        const tag = thEl.querySelector(".today-tag");
        if (tag) tag.classList.toggle("hidden", !isToday);
      });
    }

    function renderTable() {
      const schedule = getCurrentWeekSchedule();
      const tbody = document.getElementById("timetable-body");
      const filter = document.getElementById("search-input").value.toLowerCase().trim();
      const weekDays = getWeekDateRange(currentViewingWeek);
      const today = new Date();
      let html = "";

      schedule.forEach((row, rowIndex) => {
        if (filter && !row.isSpecial && !row.name.toLowerCase().includes(filter)) return;
        const isFree = row.type === "free", isBlocked = row.type === "blocked";
        
        let targetUrl = row.url;
        if (!targetUrl && !row.isSpecial) targetUrl = `class.html?classId=${encodeURIComponent(row.id)}&class=${encodeURIComponent(row.name)}`;

        html += `<tr class="${isFree ? 'bg-sky-50/20' : isBlocked ? 'bg-slate-50' : 'hover:bg-slate-50/60'} transition">
          <td class="p-2 pl-3.5 sticky-col bg-white border-r border-slate-200">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-slate-800 cursor-pointer hover:text-sky-700 transition ${isFree ? 'text-sky-700' : isBlocked ? 'text-rose-600' : ''}" onclick="editClassNameInline(${rowIndex})">${row.name}</span>
              ${!row.isSpecial ? `
                <div class="flex items-center gap-0.5">
                  <a href="${targetUrl}" target="_blank" class="p-1 rounded text-sky-600 hover:bg-sky-100 transition"><i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>
                  <button onclick="openLinkModal('${row.id}')" class="teacher-feature hidden p-1 rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700"><i data-lucide="settings" class="w-3.5 h-3.5"></i></button>
                </div>
              ` : ''}
            </div>
          </td>`;

        for (let day = 0; day < 7; day++) {
          const isToday = weekDays[day].getDate() === today.getDate() && weekDays[day].getMonth() === today.getMonth() && weekDays[day].getFullYear() === today.getFullYear();
          const cellHighlightClass = isToday ? "today-highlight-cell" : "";
          
          if (isFree) {
            html += `<td class="p-2 text-center border-r border-slate-100 align-middle leading-snug ${cellHighlightClass}">-</td>`;
          } else {
            const timeVal = row.schedule[day] || "";
            html += `<td class="p-1 text-center border-r border-slate-100 align-middle ${cellHighlightClass}" id="cell-${rowIndex}-${day}" onclick="makeCellEditable(${rowIndex}, ${day})">`;
            if (!timeVal) {
              html += `<div class="h-7 flex items-center justify-center text-slate-300 hover:bg-slate-100 rounded cursor-pointer transition">-</div>`;
            } else {
              html += `<div class="p-1 rounded border text-xs cursor-pointer transition bg-sky-50 text-sky-900 border-sky-200"><div class="font-semibold">${timeVal}</div></div>`;
            }
            html += `</td>`;
          }
        }
        html += `</tr>`;
      });
      tbody.innerHTML = html;
      lucide.createIcons();
      // Ensure gears respect current lock state after re-render
      if(!isTeacherUnlocked) document.querySelectorAll('.teacher-feature').forEach(el => el.classList.add('hidden'));
    }

    // Parse a time range such as "13:00 - 14:30" into minutes after midnight.
    function parseTimeRange(value) {
      const m = String(value || "").trim().match(/^(\d{1,2}):(\d{2})\s*[-–—至到]+\s*(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      const sh = Number(m[1]), sm = Number(m[2]), eh = Number(m[3]), em = Number(m[4]);
      if (sh > 23 || eh > 24 || sm > 59 || em > 59 || (eh === 24 && em !== 0)) return null;
      const start = sh * 60 + sm, end = eh * 60 + em;
      if (end <= start) return null;
      return { start, end };
    }

    function findScheduleConflicts(rowIndex, dayIndex, proposedValue) {
      const schedule = getCurrentWeekSchedule();
      const target = schedule[rowIndex];
      const proposed = parseTimeRange(proposedValue);
      if (!target || !proposed) return [];
      const conflicts = [];
      schedule.forEach((other, otherIndex) => {
        if (otherIndex === rowIndex || other.type === "free" || other.isSpecial && other.type !== "blocked") return;
        const otherValue = String((other.schedule || [])[dayIndex] || "").trim();
        const range = parseTimeRange(otherValue);
        if (!range) return;
        // A conflict exists when the two time intervals overlap.
        if (proposed.start < range.end && range.start < proposed.end) {
          conflicts.push({ name: other.name || "Lớp khác", time: otherValue });
        }
      });
      return conflicts;
    }

    function makeCellEditable(rowIndex, dayIndex) {
      if (!isTeacherUnlocked) return alert("Vui lòng mở khóa Giáo viên để chỉnh sửa giờ học!");
      const cell = document.getElementById(`cell-${rowIndex}-${dayIndex}`);
      if (!cell || cell.querySelector('input')) return;
      const schedule = getCurrentWeekSchedule();
      const currentVal = schedule[rowIndex].schedule[dayIndex] || "";

      const input = document.createElement('input');
      input.type = 'text'; input.value = currentVal; input.placeholder = 'HH:MM - HH:MM';
      input.className = 'w-full text-center text-xs py-1 px-1 bg-white border border-sky-500 rounded outline-none shadow-xs';
      cell.innerHTML = ''; cell.appendChild(input); input.focus(); input.select();

      let isFinished = false;
      function finishEdit() {
        if (isFinished) return;
        const proposed = input.value.trim();
        const parsed = parseTimeRange(proposed);
        if (proposed && !parsed) {
          alert("Giờ chưa đúng định dạng. Vui lòng nhập HH:MM - HH:MM (ví dụ 13:00 - 14:30).");
          isFinished = true; renderTable(); return;
        }
        const conflicts = proposed ? findScheduleConflicts(rowIndex, dayIndex, proposed) : [];
        if (conflicts.length) {
          const details = conflicts.map(c => `• ${c.name}: ${c.time}`).join("\n");
          const keep = confirm(`⚠️ PHÁT HIỆN TRÙNG LỊCH!\n\n${schedule[rowIndex].name} (${proposed}) bị trùng với:\n${details}\n\nBạn có muốn vẫn lưu khung giờ này không?`);
          if (!keep) { isFinished = true; renderTable(); return; }
        }
        isFinished = true;
        schedule[rowIndex].schedule[dayIndex] = proposed;
        persist(); renderTable();
      }
      input.addEventListener('blur', finishEdit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); else if (e.key === 'Escape') { isFinished = true; renderTable(); } });
    }

    function openLinkModal(id) {
      if (!isTeacherUnlocked) return;
      selectedEditingClassId = id;
      const row = getCurrentWeekSchedule().find(r => r.id === id);
      if (!row) return;
      document.getElementById("modal-class-name").value = row.name;
      const safeName = row.name.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '-');
      document.getElementById("modal-class-url").value = row.url || `class.html?classId=${encodeURIComponent(row.id)}&class=${encodeURIComponent(row.name)}`;
      document.getElementById("link-modal").classList.remove("hidden");
    }
    function closeLinkModal() { document.getElementById("link-modal").classList.add("hidden"); }
    function saveClassLink() {
      const row = getCurrentWeekSchedule().find(r => r.id === selectedEditingClassId);
      if (row) {
        row.name = document.getElementById("modal-class-name").value.trim() || row.name;
        row.url = document.getElementById("modal-class-url").value.trim();
        persist(); renderTable();
      }
      closeLinkModal();
    }

    function addNewClass() {
      if (!isTeacherUnlocked) return;
      const name = prompt("Tên lớp mới:");
      if (name && name.trim()) {
        const safeName = name.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '-');
        getCurrentWeekSchedule().push({
          id: makeId("CLS"), name: name.trim(), url: "", schedule: ["", "", "", "", "", "", ""]
        });
        persist(); renderTable();
      }
    }

    updateWeekUI(); renderTable();
  </script>
</body>
</html>
