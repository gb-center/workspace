<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tổng quan | gblearning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{sky:{50:"rgb(var(--sky-50) / <alpha-value>)",100:"rgb(var(--sky-100) / <alpha-value>)",200:"rgb(var(--sky-200) / <alpha-value>)",300:"rgb(var(--sky-300) / <alpha-value>)",400:"rgb(var(--sky-400) / <alpha-value>)",500:"rgb(var(--sky-500) / <alpha-value>)",600:"rgb(var(--sky-600) / <alpha-value>)",700:"rgb(var(--sky-700) / <alpha-value>)",800:"rgb(var(--sky-800) / <alpha-value>)",900:"rgb(var(--sky-900) / <alpha-value>)"}}}}}</script>
  <script src="https://unpkg.com/lucide@0.462.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lms.css">
  <script src="lms.js"></script>
  <style>
    #grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:1040px}
    #grid th,#grid td{border-bottom:1px solid var(--t-border);border-right:1px solid var(--t-border);vertical-align:top}
    #grid th:last-child,#grid td:last-child{border-right:0}
    #grid thead th{position:sticky;top:0;z-index:3;background:var(--t-tint);color:var(--t-ink);padding:10px 6px;text-align:center;font-size:.8125rem}
    #grid thead th.today{background:var(--t-primary);color:#fff}
    #grid .c-name{width:210px;position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:10px 12px}
    #grid thead th.c-name{z-index:4;background:var(--t-tint);text-align:left}
    #grid td.day{padding:6px;height:64px;cursor:pointer}
    #grid td.day:hover{background:var(--t-soft)}
    #grid td.today{background:color-mix(in srgb,var(--t-tint) 55%,transparent)}
    #grid tr.special td{background:var(--t-soft);font-size:.8125rem;color:var(--t-muted)}
    #grid tr.special .c-name{background:var(--t-soft);font-weight:700;color:var(--t-ink)}
    #grid tr.dim .c-name,#grid tr.dim td.day{opacity:.55}
    .chip{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;border-radius:12px;border:1px solid var(--t-tint-2);background:var(--t-tint);color:var(--t-ink);font-size:.8125rem;font-weight:600;line-height:1.25;min-height:44px}
    .chip small{display:block;font-weight:500;color:var(--t-muted);font-size:.75rem}
    .chip.done,.chip.makeup{background:#fff}
    .chip.holiday{background:#fff;color:var(--t-muted);text-decoration:line-through}
    .chip.holiday small{text-decoration:none}
    .chip.cancel{background:#fff;color:#be123c;border-color:#fecdd3;text-decoration:line-through}
    .chip.cancel small{text-decoration:none}
    .free-line{display:block;white-space:nowrap}
    .cls-link{font-weight:800;color:var(--t-primary);text-decoration:none}
    .cls-link:hover{text-decoration:underline}
    .day-tabs{display:none;gap:6px;overflow-x:auto;padding-bottom:4px}
    .day-tabs button{flex:1 0 auto;min-width:48px;min-height:44px;border-radius:9999px;border:1px solid var(--t-tint-2);background:#fff;color:var(--t-primary);font-weight:700;font-size:.8125rem;padding:0 10px}
    .day-tabs button[aria-pressed="true"]{background:var(--t-primary);color:#fff;border-color:var(--t-primary)}
    .dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.35)}
    .dlg[hidden]{display:none}
    .dlg .card{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border:1px solid var(--t-border);border-radius:24px;padding:22px}
    .dlg h2{font-size:1.0625rem;font-weight:800;color:var(--t-ink);margin-bottom:12px}
    .dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .dlg label{display:block;font-size:.8125rem;font-weight:700;color:var(--t-ink);margin:12px 0 6px}
    .dlg .field{width:100%}
    .dlg .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
    .dlg .err{min-height:20px;margin-top:10px;font-size:.875rem;color:#be123c}
    .btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:9999px;border:1px solid #fecdd3;background:#fff;color:#be123c;font-weight:700;font-size:.9375rem}
    .btn-danger:hover{background:#fff1f2}
    .tabbar{display:flex;gap:8px;flex-wrap:wrap}
    .tabbar button{min-height:44px;padding:0 18px;border-radius:9999px;border:1px solid var(--t-tint-2);background:#fff;color:var(--t-primary);font-weight:700;font-size:.9375rem}
    .tabbar button[aria-selected="true"]{background:var(--t-primary);color:#fff;border-color:var(--t-primary)}
    .pick{min-height:44px;padding:0 14px;border-radius:9999px;border:1px solid var(--t-tint-2);background:#fff;color:var(--t-primary);font-weight:700;font-size:.8125rem}
    .pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .dlg label.pickrow{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;padding:0 12px;border:1px solid var(--t-border);border-radius:12px;background:#fff;font-size:.9375rem;font-weight:600;cursor:pointer}
    .pickrow input{width:20px;height:20px;flex:none}
    .mat-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--t-border);border-radius:12px;background:#fff}
    .mat-item a.mat-title{font-weight:700;color:var(--t-primary);overflow-wrap:anywhere}
    .mat-item a.mat-title:hover{text-decoration:underline}
    @media (max-width:720px){
      .day-tabs{display:flex}
      #grid{min-width:0}
      #grid .c-name{width:40%}
      #grid .dcol{display:none}
      #grid[data-day="0"] .d0,#grid[data-day="1"] .d1,#grid[data-day="2"] .d2,#grid[data-day="3"] .d3,#grid[data-day="4"] .d4,#grid[data-day="5"] .d5,#grid[data-day="6"] .d6{display:table-cell}
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative">
  <nav id="lms-nav" aria-label="Điều hướng chính">
    <div class="nav-brand"><i data-lucide="graduation-cap" style="width:26px;height:26px"></i><span>gblearning</span></div>
    <a href="index.html" aria-current="page" aria-label="Tổng quan"><i data-lucide="layout-dashboard"></i><span>Tổng quan</span></a>
    <a href="student-list.html" aria-label="Học viên"><i data-lucide="users"></i><span>Học viên</span></a>
  </nav>

  <header class="has-week bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="w-full max-w-none mx-auto px-3 sm:px-5 lg:px-7 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white"><i data-lucide="calendar-days" class="w-4 h-4"></i></div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight"><span id="week-label">Tuần –</span> <span id="week-badge" class="hidden text-[11px] px-2 py-0.5 rounded-full bg-sky-600 text-white align-middle">Tuần này</span></h1>
          <div id="week-range" class="text-xs text-slate-500"></div>
        </div>
      </div>
      <div class="header-tools flex items-center gap-2">
        <button id="btn-prev" type="button" class="icon-btn" aria-label="Tuần trước"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <button id="btn-today" type="button" class="btn-soft">Tuần này</button>
        <button id="btn-next" type="button" class="icon-btn" aria-label="Tuần sau"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
        <button id="btn-theme" type="button" aria-label="Tùy chỉnh màu chủ đề" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="palette" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-none mx-auto px-3 sm:px-5 lg:px-7 py-4 sm:py-6 space-y-4">
    <div class="tabbar" role="tablist" aria-label="Chế độ xem">
      <button type="button" role="tab" id="tab-schedule" data-view="schedule" aria-selected="true">Lịch tuần</button>
      <button type="button" role="tab" id="tab-mat" data-view="mat" aria-selected="false">Bài học theo tuần</button>
      <button type="button" role="tab" id="tab-lib" data-view="lib" aria-selected="false">Học liệu</button>
    </div>

    <div id="view-schedule" class="space-y-4">
    <section class="flex flex-col lg:flex-row lg:items-center justify-between gap-3" aria-label="Công cụ">
      <div class="flex flex-col sm:flex-row sm:flex-wrap gap-2 sm:items-center">
        <input id="search" type="search" class="field w-full sm:w-56" placeholder="Tìm lớp" aria-label="Tìm lớp">
        <select id="filter-status" class="field w-full sm:w-44" aria-label="Lọc trạng thái lớp">
          <option value="active">Đang hoạt động</option>
          <option value="inactive">Tạm ngưng</option>
          <option value="archived">Lưu trữ</option>
          <option value="all">Tất cả</option>
        </select>
        <select id="sort" class="field w-full sm:w-48" aria-label="Sắp xếp lớp">
          <option value="code">Theo mã lớp</option>
          <option value="day">Ngày học gần nhất</option>
          <option value="time">Giờ học sớm nhất</option>
        </select>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btn-add-class" type="button" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>Thêm lớp</span></button>
        <button id="btn-copy" type="button" class="btn-soft"><i data-lucide="copy" class="w-4 h-4"></i><span>Chép sang tuần sau</span></button>
        <a href="student-list.html" class="btn-soft"><i data-lucide="users" class="w-4 h-4"></i><span>Quản lý học viên</span></a>
      </div>
    </section>

    <div id="day-tabs" class="day-tabs" role="group" aria-label="Chọn ngày"></div>

    <section class="bg-white rounded-2xl border border-slate-200 overflow-hidden" aria-label="Lịch tuần">
      <div class="overflow-auto" style="max-height:calc(100dvh - 210px)">
        <table id="grid" data-day="0">
          <thead><tr id="grid-head"></tr></thead>
          <tbody id="grid-body"><tr><td colspan="8" class="p-6 text-center text-slate-400 text-sm">Đang tải lịch...</td></tr></tbody>
        </table>
      </div>
    </section>
    </div>

    <section id="view-mat" hidden class="space-y-4" aria-label="Bài học theo tuần">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <p id="mat-sub" class="text-sm text-slate-600"></p>
        <div class="flex flex-wrap gap-2">
          <button id="btn-asg" type="button" class="btn-soft"><i data-lucide="send" class="w-4 h-4"></i><span>Giao bài cho nhiều lớp</span></button>
          <button id="btn-add-mat" type="button" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>Thêm mục</span></button>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <h2 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="presentation" class="w-4 h-4"></i>Bài học</h2>
          <div id="mat-lesson" class="space-y-2"></div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <h2 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="file-check-2" class="w-4 h-4"></i>Bài về nhà</h2>
          <div id="mat-homework" class="space-y-2"></div>
        </div>
      </div>
    </section>
    <section id="view-lib" hidden class="space-y-4" aria-label="Học liệu tổng hợp">
      <div class="flex flex-col sm:flex-row sm:flex-wrap gap-2 sm:items-center">
        <input id="lib-search" type="search" class="field w-full sm:w-64" placeholder="Tìm theo tên" aria-label="Tìm học liệu">
        <select id="lib-class" class="field w-full sm:w-48" aria-label="Lọc theo lớp"></select>
        <select id="lib-kind" class="field w-full sm:w-44" aria-label="Lọc theo loại">
          <option value="">Tất cả loại</option>
          <option value="lesson">Bài học</option>
          <option value="homework">Bài về nhà</option>
        </select>
      </div>
      <div id="lib-list" class="space-y-4"></div>
    </section>
    <div id="page-msg" role="alert" class="text-sm text-rose-700"></div>
  </main>

  <!-- Hộp thoại: buổi học -->
  <div id="dlg-session" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="ds-title">
    <form class="card" novalidate>
      <h2 id="ds-title">Buổi học</h2>
      <input type="hidden" id="ds-id"><input type="hidden" id="ds-class">
      <div class="text-sm text-slate-600" id="ds-info"></div>
      <label for="ds-date">Ngày</label>
      <input id="ds-date" type="date" class="field" required>
      <div class="row2">
        <div><label for="ds-start">Bắt đầu</label><input id="ds-start" type="time" class="field" required></div>
        <div><label for="ds-end">Kết thúc</label><input id="ds-end" type="time" class="field" required></div>
      </div>
      <label for="ds-status">Trạng thái</label>
      <select id="ds-status" class="field">
        <option value="planned">Chưa dạy</option>
        <option value="done">Đã dạy</option>
        <option value="cancel">Hủy (tính nợ)</option>
        <option value="makeup">Bù (trừ nợ)</option>
        <option value="holiday">Nghỉ lễ (không tính nợ)</option>
      </select>
      <label for="ds-lesson">Bài học</label>
      <input id="ds-lesson" type="text" class="field" autocomplete="off">
      <label for="ds-note">Ghi chú</label>
      <input id="ds-note" type="text" class="field" autocomplete="off">
      <div class="err" id="ds-err" role="alert"></div>
      <div class="acts">
        <button type="submit" class="btn-primary">Lưu</button>
        <button type="button" class="btn-soft" data-close>Hủy</button>
        <button type="button" class="btn-danger" id="ds-del">Xóa buổi</button>
      </div>
    </form>
  </div>

  <!-- Hộp thoại: lớp -->
  <div id="dlg-class" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dc-title">
    <form class="card" novalidate>
      <h2 id="dc-title">Lớp</h2>
      <input type="hidden" id="dc-id">
      <div class="row2">
        <div><label for="dc-code">Mã lớp</label><input id="dc-code" type="text" class="field" autocomplete="off" required></div>
        <div><label for="dc-group">Nhóm (không bắt buộc)</label><input id="dc-group" type="text" class="field" autocomplete="off"></div>
      </div>
      <label for="dc-name">Tên lớp</label>
      <input id="dc-name" type="text" class="field" autocomplete="off" required>
      <label for="dc-url">Link trang lớp riêng (để trống = trang lớp mặc định)</label>
      <input id="dc-url" type="text" class="field" autocomplete="off" placeholder="class.html?class=...">
      <label for="dc-state">Trạng thái</label>
      <select id="dc-state" class="field">
        <option value="active">Đang hoạt động</option>
        <option value="inactive">Tạm ngưng</option>
        <option value="archived">Lưu trữ</option>
      </select>
      <div class="err" id="dc-err" role="alert"></div>
      <div class="acts">
        <button type="submit" class="btn-primary">Lưu</button>
        <button type="button" class="btn-soft" data-close>Hủy</button>
        <button type="button" class="btn-danger" id="dc-del">Xóa lớp</button>
      </div>
    </form>
  </div>

  <!-- Hộp thoại: học liệu tuần -->
  <div id="dlg-mat" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dm-title">
    <form class="card" novalidate>
      <h2 id="dm-title">Mục học liệu</h2>
      <input type="hidden" id="dm-id"><input type="hidden" id="dm-week">
      <label for="dm-kind">Loại</label>
      <select id="dm-kind" class="field">
        <option value="lesson">Bài học</option>
        <option value="homework">Bài về nhà</option>
      </select>
      <label for="dm-name">Tên</label>
      <input id="dm-name" type="text" class="field" autocomplete="off" required>
      <label for="dm-url">Link</label>
      <input id="dm-url" type="text" inputmode="url" class="field" autocomplete="off" placeholder="https://..." required>
      <label>Giao cho lớp</label>
      <div id="dm-quick" class="flex flex-wrap gap-2"></div>
      <div id="dm-classes" class="pickgrid" style="margin-top:10px"></div>
      <div class="err" id="dm-err" role="alert"></div>
      <div class="acts">
        <button type="submit" class="btn-primary">Lưu</button>
        <button type="button" class="btn-soft" data-close>Hủy</button>
        <button type="button" class="btn-danger" id="dm-del">Xóa mục</button>
      </div>
    </form>
  </div>

  <!-- Hộp thoại: giao bài online cho nhiều lớp -->
  <div id="dlg-asg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="da-title">
    <form class="card" novalidate>
      <h2 id="da-title">Giao bài cho nhiều lớp</h2>
      <label for="da-code">Bài</label>
      <select id="da-code" class="field"></select>
      <label for="da-week">Tuần (ngày đầu tuần)</label>
      <input id="da-week" type="date" class="field">
      <label for="da-due">Hạn nộp</label>
      <input id="da-due" type="datetime-local" class="field">
      <label>Giao cho lớp</label>
      <div id="da-quick" class="flex flex-wrap gap-2"></div>
      <div id="da-classes" class="pickgrid" style="margin-top:10px"></div>
      <p class="text-xs text-slate-500" style="margin-top:8px">Lớp đã được giao sẽ được tick sẵn. Giao lại chỉ cập nhật tuần và hạn nộp. Bỏ tick không gỡ bài đã giao.</p>
      <div class="err" id="da-err" role="alert"></div>
      <div class="acts">
        <button type="submit" class="btn-primary">Giao bài</button>
        <button type="button" class="btn-soft" data-close>Hủy</button>
      </div>
    </form>
  </div>

  <!-- Hộp thoại: lịch bận -->
  <div id="dlg-blocked" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="db-title">
    <form class="card" novalidate>
      <h2 id="db-title">Lịch bận</h2>
      <div class="text-sm text-slate-600" id="db-info"></div>
      <label for="db-text">Khung giờ (mỗi dòng một khung, dạng 08:00 - 17:00)</label>
      <textarea id="db-text" class="field" rows="4"></textarea>
      <div class="err" id="db-err" role="alert"></div>
      <div class="acts">
        <button type="submit" class="btn-primary">Lưu</button>
        <button type="button" class="btn-soft" data-close>Hủy</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      const esc = LMS.esc;
      const icons = () => { if (window.lucide) lucide.createIcons(); };
      const DAY = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
      const BASE_MONDAY = new Date(2026, 8, 7);   // tuần 1 bắt đầu thứ 2 07/09/2026
      const STATUS_TXT = { planned: 'Chưa dạy', done: 'Đã dạy', cancel: 'Hủy', makeup: 'Bù', holiday: 'Nghỉ lễ' };
      const DEF_BLOCKED = ['07:00 - 22:30', '08:00 - 17:00', '08:00 - 17:00', '08:00 - 17:00', '08:00 - 19:00', '20:30 - 22:00', '18:00 - 22:30'];
      const st = { c: null, classes: [], counts: {}, sessions: [], blocked: DEF_BLOCKED.slice(), week: 1, selDay: 0, busy: false, view: 'schedule', mats: [], lib: [] };

      const pad = n => String(n).padStart(2, '0');
      const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      const t5 = v => (v || '').slice(0, 5);
      const toMin = s => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
      const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
      const natural = (a, b) => String(a).localeCompare(String(b), 'vi', { numeric: true });

      function weekOfToday() {
        const now = new Date(), dow = (now.getDay() + 6) % 7;
        const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
        return 1 + Math.round((mon - BASE_MONDAY) / (7 * 864e5));
      }
      const NOW_WEEK = weekOfToday();
      function weekDates(w) {
        const mon = new Date(BASE_MONDAY); mon.setDate(mon.getDate() + (w - 1) * 7);
        return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
      }
      function parseRanges(text) {
        return String(text || '').split(/\n|;/).map(l => {
          const m = /(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/.exec(l);
          return m ? { s: (+m[1]) * 60 + (+m[2]), e: (+m[3]) * 60 + (+m[4]) } : null;
        }).filter(r => r && r.e > r.s);
      }
      const overlap = (a, b) => a.s < b.e && b.s < a.e;

      /* ---------- Tải dữ liệu ---------- */
      async function loadClasses() {
        const [c, cs, s] = await Promise.all([
          st.c.from('classes').select('id,class_code,class_name,is_active,group_code'),
          st.c.from('class_settings').select('class_id,page_url,is_archived'),
          st.c.from('students').select('class_id').eq('is_active', true)
        ]);
        if (c.error) throw c.error; if (cs.error) throw cs.error; if (s.error) throw s.error;
        const set = {}; (cs.data || []).forEach(r => { set[r.class_id] = r; });
        st.classes = (c.data || []).map(r => Object.assign({}, r, {
          page_url: (set[r.id] || {}).page_url || '', is_archived: !!(set[r.id] || {}).is_archived
        }));
        st.counts = {}; (s.data || []).forEach(r => { if (r.class_id) st.counts[r.class_id] = (st.counts[r.class_id] || 0) + 1; });
      }
      async function loadBlocked() {
        const r = await st.c.from('app_settings').select('value').eq('key', 'blocked_weekly').maybeSingle();
        if (!r.error && r.data && Array.isArray(r.data.value) && r.data.value.length === 7) st.blocked = r.data.value.map(String);
      }
      async function loadWeek() {
        const d = weekDates(st.week);
        const r = await st.c.from('sessions').select('id,class_id,session_no,session_date,start_time,end_time,status,lesson,note')
          .gte('session_date', ymd(d[0])).lte('session_date', ymd(d[6])).order('start_time');
        if (r.error) throw r.error;
        st.sessions = r.data || [];
      }
      async function refresh(msg) {
        try { await Promise.all([loadWeek(), loadMats(), st.view === 'lib' ? loadLib() : null]); render(); if (msg) LMS.toast(msg); }
        catch (e) { $('page-msg').textContent = LMS.friendlyError(e); }
      }

      /* ---------- Hiển thị ---------- */
      const classState = c => c.is_archived ? 'archived' : (c.is_active ? 'active' : 'inactive');
      const sessionsOf = (cid, date) => st.sessions.filter(s => s.class_id === cid && s.session_date === date);

      function freeTimes(date, dayIdx) {
        const W0 = 7 * 60, W1 = 22 * 60 + 30, busy = [];
        parseRanges(st.blocked[dayIdx]).forEach(r => busy.push(r));
        st.sessions.forEach(s => {
          if (s.session_date !== date || s.status === 'cancel' || s.status === 'holiday') return;
          const c = st.classes.find(x => x.id === s.class_id);
          if (!c || classState(c) !== 'active') return;
          const a = toMin(s.start_time), b = toMin(s.end_time);
          if (a != null && b != null && b > a) busy.push({ s: a, e: b });
        });
        busy.forEach(r => { r.s = Math.max(W0, r.s); r.e = Math.min(W1, r.e); });
        const list = busy.filter(r => r.e > r.s).sort((a, b) => a.s - b.s || a.e - b.e), merged = [];
        list.forEach(r => { const l = merged[merged.length - 1]; if (l && r.s <= l.e) l.e = Math.max(l.e, r.e); else merged.push({ s: r.s, e: r.e }); });
        const out = []; let cur = W0;
        merged.forEach(r => { if (r.s > cur) out.push({ s: cur, e: r.s }); cur = Math.max(cur, r.e); });
        if (cur < W1) out.push({ s: cur, e: W1 });
        return out.filter(r => r.e - r.s >= 60).map(r => fmt(r.s) + ' - ' + fmt(r.e));
      }

      function visibleClasses() {
        const q = $('search').value.trim().toLowerCase(), f = $('filter-status').value, sort = $('sort').value;
        const dates = weekDates(st.week).map(ymd);
        let list = st.classes.filter(c => {
          if (q && !(c.class_code + ' ' + c.class_name).toLowerCase().includes(q)) return false;
          return f === 'all' || classState(c) === f;
        });
        const first = c => {
          const ss = st.sessions.filter(s => s.class_id === c.id && s.status !== 'cancel');
          if (!ss.length) return { d: 99, t: 9999 };
          const x = ss.slice().sort((a, b) => a.session_date.localeCompare(b.session_date) || a.start_time.localeCompare(b.start_time))[0];
          return { d: dates.indexOf(x.session_date), t: toMin(x.start_time) };
        };
        list.sort((a, b) => {
          if (sort === 'day') return first(a).d - first(b).d || first(a).t - first(b).t || natural(a.class_code, b.class_code);
          if (sort === 'time') return first(a).t - first(b).t || natural(a.class_code, b.class_code);
          return natural(a.class_code, b.class_code);
        });
        return list;
      }

      function render() {
        const dates = weekDates(st.week), keys = dates.map(ymd), todayKey = ymd(new Date());
        $('week-label').textContent = 'Tuần ' + pad(st.week);
        $('week-badge').classList.toggle('hidden', st.week !== NOW_WEEK);
        $('week-range').textContent = pad(dates[0].getDate()) + '.' + pad(dates[0].getMonth() + 1) + ' – ' + pad(dates[6].getDate()) + '.' + pad(dates[6].getMonth() + 1) + '.' + dates[6].getFullYear();
        $('grid').dataset.day = String(st.selDay);

        $('day-tabs').innerHTML = DAY.map((n, i) => `<button type="button" data-day="${i}" aria-pressed="${i === st.selDay}">${i === 6 ? 'CN' : 'T' + (i + 2)} ${pad(dates[i].getDate())}/${pad(dates[i].getMonth() + 1)}</button>`).join('');
        $('grid-head').innerHTML = '<th class="c-name">Lớp</th>' + DAY.map((n, i) =>
          `<th class="dcol d${i}${keys[i] === todayKey ? ' today' : ''}">${n}<div style="font-weight:500;opacity:.8">${pad(dates[i].getDate())}/${pad(dates[i].getMonth() + 1)}</div></th>`).join('');

        let html = '';
        html += '<tr class="special"><td class="c-name">Lịch rảnh</td>' + keys.map((k, i) => {
          const f = freeTimes(k, i);
          return `<td class="dcol d${i}${k === todayKey ? ' today' : ''}" style="padding:6px">${f.length ? f.map(x => `<span class="free-line">${x}</span>`).join('') : '–'}</td>`;
        }).join('') + '</tr>';
        html += '<tr class="special"><td class="c-name">Lịch bận</td>' + keys.map((k, i) =>
          `<td class="dcol d${i}${k === todayKey ? ' today' : ''}" data-blocked="${i}" style="padding:6px;cursor:pointer">${parseRanges(st.blocked[i]).map(r => `<span class="free-line">${fmt(r.s)} - ${fmt(r.e)}</span>`).join('') || '–'}</td>`).join('') + '</tr>';

        const list = visibleClasses();
        if (!list.length) html += '<tr><td colspan="8" class="p-6 text-center text-slate-400 text-sm">Không có lớp phù hợp.</td></tr>';
        list.forEach(c => {
          const s = classState(c), url = c.page_url || ('class.html?class=' + encodeURIComponent(c.class_code));
          const n = st.counts[c.id] || 0, sub = c.class_name && c.class_name !== c.class_code ? c.class_name : '';
          html += `<tr class="${s !== 'active' ? 'dim' : ''}"><td class="c-name"><div class="flex items-start justify-between gap-2"><div style="min-width:0">
            <a class="cls-link" href="${esc(url)}">${esc(c.class_code)}</a>
            ${sub ? `<div class="text-xs text-slate-500" style="overflow-wrap:anywhere">${esc(sub)}</div>` : ''}
            <div class="text-xs text-slate-500">${n} học viên${s === 'inactive' ? ' · Tạm ngưng' : s === 'archived' ? ' · Lưu trữ' : ''}</div></div>
            <button type="button" class="icon-btn" style="width:36px;height:36px;flex:none" data-edit-class="${c.id}" aria-label="Sửa lớp ${esc(c.class_code)}"><i data-lucide="settings" class="w-4 h-4"></i></button></div></td>`
            + keys.map((k, i) => {
              const ss = sessionsOf(c.id, k);
              return `<td class="day dcol d${i}${k === todayKey ? ' today' : ''}" data-class="${c.id}" data-date="${k}">` + ss.map(x =>
                `<button type="button" class="chip ${x.status}" data-sid="${x.id}">${t5(x.start_time)} - ${t5(x.end_time)}<small>${x.status === 'cancel' ? 'Hủy' : (x.session_no ? 'Buổi ' + x.session_no : '')}${x.status === 'done' ? ' · Đã dạy' : x.status === 'makeup' ? ' · Bù' : x.status === 'holiday' ? ' · Nghỉ lễ' : ''}${x.lesson ? ' · ' + esc(x.lesson) : ''}${x.note ? ' · ' + esc(x.note) : ''}</small></button>`).join('') + '</td>';
            }).join('') + '</tr>';
        });
        $('grid-body').innerHTML = html;
        $('page-msg').textContent = '';
        icons();
        renderMats(); renderLib();
      }

      /* ---------- Bài học theo tuần ---------- */
      const isHttp = u => /^https?:\/\/\S+$/i.test(u || '');
      const weekKey = () => ymd(weekDates(st.week)[0]);
      const PROGRAM = { AC: 'Global Success', IE: 'IELTS', TO: 'TOEIC', GT: 'Speaking' };
      const matClasses = () => st.classes.filter(c => !c.is_archived).sort((a, b) => natural(a.class_code, b.class_code));
      async function loadMats() {
        const r = await st.c.from('week_materials').select('id,week_start,kind,title,url,class_ids,sort_order')
          .eq('week_start', weekKey()).order('sort_order').order('id');
        if (r.error) throw r.error;
        st.mats = r.data || [];
      }
      async function setView(v) {
        st.view = v;
        $('view-schedule').hidden = v !== 'schedule'; $('view-mat').hidden = v !== 'mat'; $('view-lib').hidden = v !== 'lib';
        document.querySelectorAll('.tabbar [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
        if (v === 'lib') { try { await loadLib(); } catch (e) { $('page-msg').textContent = LMS.friendlyError(e); } }
        renderMats(); renderLib();
      }
      async function loadLib() {
        const r = await st.c.from('week_materials').select('id,week_start,kind,title,url,class_ids,sort_order')
          .order('week_start', { ascending: false }).order('sort_order').order('id');
        if (r.error) throw r.error;
        st.lib = r.data || [];
      }
      const weekNoOf = key => { const [y, m, d] = key.split('-').map(Number); return 1 + Math.round((new Date(y, m - 1, d) - BASE_MONDAY) / (7 * 864e5)); };
      function renderLib() {
        if (st.view !== 'lib') return;
        const sel = $('lib-class'), cur = sel.value;
        sel.innerHTML = '<option value="">Tất cả lớp</option>' + matClasses().map(c => `<option value="${c.id}">${esc(c.class_code)}</option>`).join('');
        sel.value = cur;
        const q = $('lib-search').value.trim().toLowerCase(), cid = Number(sel.value) || 0, kind = $('lib-kind').value;
        const list = st.lib.filter(m => (!q || m.title.toLowerCase().includes(q)) && (!cid || (m.class_ids || []).includes(cid)) && (!kind || m.kind === kind));
        const byWeek = {}; list.forEach(m => { (byWeek[m.week_start] = byWeek[m.week_start] || []).push(m); });
        const keys = Object.keys(byWeek).sort().reverse();
        $('lib-list').innerHTML = keys.length ? keys.map(k => {
          const n = weekNoOf(k), d = weekDates(n);
          return `<div class="bg-white rounded-2xl border border-slate-200 p-4"><h2 class="text-sm font-bold text-slate-900 mb-3">Tuần ${pad(n)} <span class="font-normal text-slate-500">(${pad(d[0].getDate())}.${pad(d[0].getMonth() + 1)} – ${pad(d[6].getDate())}.${pad(d[6].getMonth() + 1)})</span></h2>
            <div class="space-y-2">${byWeek[k].map(m => `<div class="mat-item"><div class="min-w-0 flex-1">
              <a class="mat-title" href="${isHttp(m.url) ? esc(m.url) : '#'}" target="_blank" rel="noopener">${esc(m.title)}</a>
              <div class="text-xs text-slate-500 mt-1">${m.kind === 'homework' ? 'Bài về nhà' : 'Bài học'} · ${targetsText(m)}</div></div>
              <button type="button" class="icon-btn" data-edit-mat="${m.id}" aria-label="Sửa mục"><i data-lucide="pencil" class="w-4 h-4"></i></button></div>`).join('')}</div></div>`;
        }).join('') : '<p class="text-sm text-slate-400">Chưa có học liệu nào.</p>';
        icons();
      }
      function targetsText(m) {
        const ids = m.class_ids || [], all = matClasses();
        if (!ids.length) return '<span class="text-rose-700">Chưa giao cho lớp nào</span>';
        const codes = ids.map(id => (st.classes.find(c => c.id === id) || {}).class_code).filter(Boolean).sort(natural);
        if (all.length && all.every(c => ids.includes(c.id))) return 'Tất cả lớp';
        return esc(codes.join(', '));
      }
      function matItem(m) {
        return `<div class="mat-item"><div class="min-w-0 flex-1">
          <a class="mat-title" href="${isHttp(m.url) ? esc(m.url) : '#'}" target="_blank" rel="noopener">${esc(m.title)}</a>
          <div class="text-xs text-slate-500 mt-1">${targetsText(m)}</div></div>
          <button type="button" class="icon-btn" data-edit-mat="${m.id}" aria-label="Sửa mục"><i data-lucide="pencil" class="w-4 h-4"></i></button></div>`;
      }
      function renderMats() {
        if (st.view !== 'mat') return;
        const d = weekDates(st.week);
        $('mat-sub').textContent = 'Tuần ' + pad(st.week) + ' (' + pad(d[0].getDate()) + '.' + pad(d[0].getMonth() + 1) + ' – ' + pad(d[6].getDate()) + '.' + pad(d[6].getMonth() + 1) + '). Mỗi mục tự hiện ở trang lớp và trang học sinh của các lớp được chọn.';
        [['lesson', 'mat-lesson'], ['homework', 'mat-homework']].forEach(([k, id]) => {
          const list = st.mats.filter(m => m.kind === k);
          $(id).innerHTML = list.length ? list.map(matItem).join('') : '<p class="text-sm text-slate-400">Chưa có mục nào.</p>';
        });
        icons();
      }
      function quickGroups() {
        const cls = matClasses(), out = [];
        const prog = {}, fam = {};
        cls.forEach(c => {
          const p = (/^[A-Za-z]+/.exec(c.class_code) || [''])[0].toUpperCase();
          (prog[PROGRAM[p] || p] = prog[PROGRAM[p] || p] || []).push(c.id);
          const f = c.group_code || c.class_code.split('.')[0];
          (fam[f] = fam[f] || []).push(c.id);
        });
        out.push({ label: 'Tất cả lớp', ids: cls.map(c => c.id) });
        Object.keys(prog).sort(natural).forEach(k => { if (prog[k].length > 1) out.push({ label: k, ids: prog[k] }); });
        Object.keys(fam).sort(natural).forEach(k => { if (fam[k].length > 1) out.push({ label: k, ids: fam[k] }); });
        return out;
      }
      let quick = [];
      function openMat(id) {
        $('dm-err').textContent = '';
        const m = id ? (st.mats.find(x => x.id === Number(id)) || st.lib.find(x => x.id === Number(id))) : null;
        $('dm-id').value = m ? m.id : ''; $('dm-week').value = m ? m.week_start : weekKey();
        $('dm-title').textContent = m ? 'Sửa mục học liệu' : 'Thêm mục học liệu';
        $('dm-kind').value = m ? m.kind : 'lesson';
        $('dm-name').value = m ? m.title : ''; $('dm-url').value = m ? m.url : '';
        const sel = new Set(m ? m.class_ids : []);
        const cls = matClasses(); (m ? m.class_ids : []).forEach(cid => { const c = st.classes.find(x => x.id === cid); if (c && c.is_archived) cls.push(c); });
        $('dm-classes').innerHTML = cls.map(c => `<label class="pickrow"><input type="checkbox" value="${c.id}"${sel.has(c.id) ? ' checked' : ''}><span>${esc(c.class_code)}</span></label>`).join('');
        quick = quickGroups();
        $('dm-quick').innerHTML = quick.map((g, i) => `<button type="button" class="pick" data-q="${i}">${esc(g.label)}</button>`).join('') + '<button type="button" class="pick" data-q="none">Bỏ chọn</button>';
        $('dm-del').style.display = m ? '' : 'none';

      }
      async function saveMat(ev) {
        ev.preventDefault();

      async function deleteMat() {

        if (res.error) { $('dm-err').textContent = LMS.friendlyError(res.error); return; }

      /* ---------- Giao bài online hàng loạt ---------- */
      const pad2 = n => String(n).padStart(2, '0');
      const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
      async function openAsg() {
        $('da-err').textContent = '';
        const r = await st.c.from('assignments').select('id,assignment_code,assignment_name,week_start,due_at').eq('is_active', true).order('assignment_code');
        if (r.error) { $('page-msg').textContent = LMS.friendlyError(r.error); return; }

        $('da-code').innerHTML = st.asgList.map(a => `<option value="${esc(a.assignment_code)}">${esc(a.assignment_name || a.assignment_code)} (${esc(a.assignment_code)})</option>`).join('');

        $('da-quick').innerHTML = quick.map((g, i) => `<button type="button" class="pick" data-q="${i}">${esc(g.label)}</button>`).join('') + '<button type="button" class="pick" data-q="none">Bỏ chọn</button>';
        openDlg('dlg-asg');
        await asgPick();
      }
      async function asgPick() {
        const a = st.asgList.find(x => x.assignment_code === $('da-code').value);
        const ex = a ? await st.c.from('assignment_classes').select('class_id,week_start,due_at').eq('assignment_id', a.id) : { data: [] };
        const have = new Set((ex.data || []).map(x => x.class_id));

        $('da-week').value = (first && first.week_start) || (a && a.week_start) || weekKey();
        $('da-due').value = toLocalInput((first && first.due_at) || (a && a.due_at));

      }
      async function saveAsg(ev) {
        ev.preventDefault();
        const err = $('da-err'), code = $('da-code').value;
        const codes = [...document.querySelectorAll('#da-classes input:checked')].map(i => i.value);

        const due = $('da-due').value ? new Date($('da-due').value).toISOString() : null;
        const res = await st.c.rpc('assign_assignment_bulk', { p_assignment_code: code, p_class_codes: codes, p_class_prefix: null, p_week_start: $('da-week').value || null, p_due_at: due });
        if (res.error) { err.textContent = LMS.friendlyError(res.error); return; }

      function openDlg(id) { $(id).hidden = false; }
      function closeDlgs() { document.querySelectorAll('.dlg').forEach(d => { d.hidden = true; }); }
      const classLabel = id => { const c = st.classes.find(x => x.id === Number(id)); return c ? c.class_code : ''; };

      function openSession(sid, classId, date) {
        $('ds-err').textContent = '';
        if (sid) {
          const s = st.sessions.find(x => x.id === Number(sid)); if (!s) return;
          $('ds-id').value = s.id; $('ds-class').value = s.class_id; $('ds-date').value = s.session_date;
          $('ds-start').value = t5(s.start_time); $('ds-end').value = t5(s.end_time); $('ds-status').value = s.status;

          $('ds-title').textContent = 'Thêm buổi học'; $('ds-del').hidden = true;
          $('ds-info').textContent = classLabel(classId);
        }
        openDlg('dlg-session');
        setTimeout(() => { if (!sid) $('ds-start').focus(); }, 30);
      }

      function conflictsFor(classId, date, a, b, ignoreId) {
        const out = [], r = { s: a, e: b }, di = (new Date(date + 'T00:00:00').getDay() + 6) % 7;
        // so sánh trong tuần đang xem; ngày ngoài tuần được tải riêng khi cần
        st.sessions.forEach(s => {
          if (s.id === ignoreId || s.class_id === classId || s.session_date !== date || s.status === 'cancel' || s.status === 'holiday') return;
          const c = st.classes.find(x => x.id === s.class_id);
          if (!c || classState(c) !== 'active') return;
          if (overlap(r, { s: toMin(s.start_time), e: toMin(s.end_time) })) out.push(c.class_code + ' ' + t5(s.start_time) + ' - ' + t5(s.end_time));
        });
        parseRanges(st.blocked[di]).forEach(x => { if (overlap(r, x) && !(x.s <= 7 * 60 && x.e >= 22 * 60)) out.push('Lịch bận ' + fmt(x.s) + ' - ' + fmt(x.e)); });
        return out;
      }

      async function saveSession(ev) {
        ev.preventDefault(); if (st.busy) return;
        const id = $('ds-id').value, classId = Number($('ds-class').value), date = $('ds-date').value;
        const a = toMin($('ds-start').value), b = toMin($('ds-end').value), err = $('ds-err');
        if (!date) { err.textContent = 'Chọn ngày.'; return; }
        if (a == null || b == null) { err.textContent = 'Nhập giờ bắt đầu và kết thúc.'; return; }
        if (b <= a) { err.textContent = 'Giờ kết thúc phải sau giờ bắt đầu.'; return; }
        const status = $('ds-status').value;
        if (status !== 'cancel' && status !== 'holiday') {
          const cf = conflictsFor(classId, date, a, b, id ? Number(id) : null);
          if (cf.length && !confirm('Buổi này trùng với:\n' + cf.join('\n') + '\n\nVẫn lưu?')) return;
        }
        const payload = { class_id: classId, session_date: date, start_time: $('ds-start').value, end_time: $('ds-end').value, status,
          lesson: $('ds-lesson').value.trim() || null, note: $('ds-note').value.trim() || null, updated_at: new Date().toISOString() };
        st.busy = true;
        const res = id ? await st.c.from('sessions').update(payload).eq('id', Number(id)) : await st.c.from('sessions').insert(payload);
        st.busy = false;
        if (res.error) { err.textContent = LMS.friendlyError(res.error); return; }
        closeDlgs(); await refresh(id ? 'Đã cập nhật buổi học.' : 'Đã thêm buổi học.');
      }
      async function deleteSession() {
        const id = Number($('ds-id').value); if (!id) return;
        if (!confirm('Xóa buổi học này? Điểm danh của buổi cũng bị xóa.')) return;
        const res = await st.c.from('sessions').delete().eq('id', id);
        if (res.error) { $('ds-err').textContent = LMS.friendlyError(res.error); return; }
        closeDlgs(); await refresh('Đã xóa buổi học.');
      }

      function openClass(id) {
        $('dc-err').textContent = '';
        const c = id ? st.classes.find(x => x.id === Number(id)) : null;
        $('dc-id').value = c ? c.id : '';
        $('dc-code').value = c ? c.class_code : ''; $('dc-name').value = c ? c.class_name : '';
        $('dc-group').value = c ? (c.group_code || '') : ''; $('dc-url').value = c ? c.page_url : '';
        $('dc-state').value = c ? classState(c) : 'active';
        $('dc-title').textContent = c ? 'Sửa lớp' : 'Thêm lớp'; $('dc-del').hidden = !c;
        openDlg('dlg-class'); setTimeout(() => $('dc-code').focus(), 30);
      }
      async function saveClass(ev) {
        ev.preventDefault(); if (st.busy) return;
        const id = $('dc-id').value, code = $('dc-code').value.trim(), name = $('dc-name').value.trim() || code, err = $('dc-err');
        if (!code) { err.textContent = 'Nhập mã lớp.'; return; }
        if (st.classes.some(c => c.class_code.toLowerCase() === code.toLowerCase() && String(c.id) !== id)) { err.textContent = 'Mã lớp này đã có.'; return; }
        const state = $('dc-state').value;
        const base = { class_code: code, class_name: name, group_code: $('dc-group').value.trim() || null, is_active: state === 'active' };
        const settings = { page_url: $('dc-url').value.trim() || null, is_archived: state === 'archived' };
        st.busy = true; let cid = id ? Number(id) : null, res;
        if (cid) res = await st.c.from('classes').update(base).eq('id', cid);
        else { res = await st.c.from('classes').insert(base).select('id').single(); if (!res.error) cid = res.data.id; }
        if (!res.error) res = await st.c.from('class_settings').upsert(Object.assign({ class_id: cid }, settings));
        st.busy = false;
        if (res.error) { err.textContent = LMS.friendlyError(res.error); return; }
        closeDlgs(); await loadClasses(); await refresh(id ? 'Đã cập nhật lớp.' : 'Đã thêm lớp.');
      }
      async function deleteClass() {
        const id = Number($('dc-id').value), c = st.classes.find(x => x.id === id); if (!c) return;
        if ((st.counts[id] || 0) > 0) { $('dc-err').textContent = 'Lớp còn học viên đang học. Chuyển lớp sang Lưu trữ thay vì xóa.'; return; }
        if (!confirm('Xóa lớp "' + c.class_code + '" cùng toàn bộ buổi học và điểm danh của lớp?')) return;
        const res = await st.c.from('classes').delete().eq('id', id);
        if (res.error) { $('dc-err').textContent = res.error.code === '23503' ? 'Lớp đã có bài tập hoặc bài nộp nên không xóa được. Chuyển sang Lưu trữ.' : LMS.friendlyError(res.error); return; }
        closeDlgs(); await loadClasses(); await refresh('Đã xóa lớp.');
      }

      function openBlocked(i) {
        $('db-err').textContent = ''; $('db-info').textContent = DAY[i] + ' hằng tuần. Giờ này được tính là bận khi tìm lịch rảnh.';
        $('db-text').value = parseRanges(st.blocked[i]).map(r => fmt(r.s) + ' - ' + fmt(r.e)).join('\n');
        $('db-text').dataset.day = i; openDlg('dlg-blocked');
      }
      async function saveBlocked(ev) {
        ev.preventDefault();
        const i = Number($('db-text').dataset.day), raw = $('db-text').value.trim();
        const rs = parseRanges(raw);
        if (raw && rs.length !== raw.split(/\n|;/).filter(l => l.trim()).length) { $('db-err').textContent = 'Có dòng chưa đúng dạng 08:00 - 17:00.'; return; }
        const next = st.blocked.slice(); next[i] = rs.map(r => fmt(r.s) + ' - ' + fmt(r.e)).join('\n');
        const res = await st.c.from('app_settings').upsert({ key: 'blocked_weekly', value: next });
        if (res.error) { $('db-err').textContent = LMS.friendlyError(res.error); return; }
        st.blocked = next; closeDlgs(); render(); LMS.toast('Đã cập nhật lịch bận.');
      }

      async function copyNextWeek() {
        const dates = weekDates(st.week), mine = st.sessions;
        if (!mine.length) { LMS.toast('Tuần này chưa có buổi nào để chép.'); return; }
        if (!confirm('Chép lịch Tuần ' + pad(st.week) + ' sang Tuần ' + pad(st.week + 1) + '? Chỉ thêm vào ngày lớp chưa có buổi.')) return;
        const nd = weekDates(st.week + 1).map(ymd);
        const ex = await st.c.from('sessions').select('class_id,session_date').gte('session_date', nd[0]).lte('session_date', nd[6]);
        if (ex.error) { LMS.toast(LMS.friendlyError(ex.error)); return; }
        const have = new Set((ex.data || []).map(r => r.class_id + '|' + r.session_date));
        const rows = [];
        mine.forEach(s => {
          const di = dates.map(ymd).indexOf(s.session_date), d2 = nd[di], key = s.class_id + '|' + d2;
          if (di < 0 || have.has(key) || s.status === 'cancel') return;
          rows.push({ class_id: s.class_id, session_date: d2, start_time: s.start_time, end_time: s.end_time, status: 'planned' });
        });
        if (!rows.length) { LMS.toast('Tuần sau đã có đủ lịch.'); return; }
        const res = await st.c.from('sessions').insert(rows);
        if (res.error) { LMS.toast(LMS.friendlyError(res.error)); return; }
        st.week += 1; await refresh('Đã chép ' + rows.length + ' buổi sang tuần sau.');
      }

      /* ---------- Sự kiện ---------- */
      function bind() {
        $('btn-prev').addEventListener('click', () => { if (st.week > 1) { st.week -= 1; refresh(); } });
        $('btn-next').addEventListener('click', () => { st.week += 1; refresh(); });
        $('btn-today').addEventListener('click', () => { st.week = NOW_WEEK; st.selDay = Math.max(0, (new Date().getDay() + 6) % 7); refresh(); });
        $('btn-add-class').addEventListener('click', () => openClass(null));
        $('btn-copy').addEventListener('click', copyNextWeek);
        ['search', 'filter-status', 'sort'].forEach(id => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));
        $('day-tabs').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) { st.selDay = Number(b.dataset.day); render(); } });
        $('grid-body').addEventListener('click', e => {
          const ec = e.target.closest('[data-edit-class]'); if (ec) return openClass(ec.dataset.editClass);
          const ch = e.target.closest('[data-sid]'); if (ch) return openSession(ch.dataset.sid);
          const bl = e.target.closest('[data-blocked]'); if (bl) return openBlocked(Number(bl.dataset.blocked));
          const td = e.target.closest('td.day'); if (td) openSession(null, td.dataset.class, td.dataset.date);
        });
        $('dlg-session').querySelector('form').addEventListener('submit', saveSession);
        $('ds-del').addEventListener('click', deleteSession);
        $('dlg-class').querySelector('form').addEventListener('submit', saveClass);
        $('dc-del').addEventListener('click', deleteClass);
        $('dlg-blocked').querySelector('form').addEventListener('submit', saveBlocked);
        document.querySelectorAll('.tabbar [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
        $('btn-add-mat').addEventListener('click', () => openMat(null));
        $('view-mat').addEventListener('click', e => { const b = e.target.closest('[data-edit-mat]'); if (b) openMat(b.dataset.editMat); });
        $('view-lib').addEventListener('click', e => { const b = e.target.closest('[data-edit-mat]'); if (b) openMat(b.dataset.editMat); });
        ['lib-search', 'lib-class', 'lib-kind'].forEach(id => $(id).addEventListener(id === 'lib-search' ? 'input' : 'change', renderLib));
        $('dlg-mat').querySelector('form').addEventListener('submit', saveMat);
        $('dm-del').addEventListener('click', deleteMat);
        $('btn-asg').addEventListener('click', openAsg);
        $('dlg-asg').querySelector('form').addEventListener('submit', saveAsg);
        $('da-code').addEventListener('change', asgPick);
        $('da-quick').addEventListener('click', e => {
          const b = e.target.closest('[data-q]'); if (!b) return;
          const boxes = document.querySelectorAll('#da-classes input');
          if (b.dataset.q === 'none') { boxes.forEach(x => { x.checked = false; }); return; }
          const ids = new Set(quick[Number(b.dataset.q)].ids);
          boxes.forEach(x => { if (ids.has(Number(x.dataset.id))) x.checked = true; });
        });
        $('dm-quick').addEventListener('click', e => {
          const b = e.target.closest('[data-q]'); if (!b) return;
          const boxes = document.querySelectorAll('#dm-classes input');
          if (b.dataset.q === 'none') { boxes.forEach(x => { x.checked = false; }); return; }
          const ids = new Set(quick[Number(b.dataset.q)].ids);
          boxes.forEach(x => { if (ids.has(Number(x.value))) x.checked = true; });
        });
        document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeDlgs));
        document.querySelectorAll('.dlg').forEach(d => d.addEventListener('click', e => { if (e.target === d) closeDlgs(); }));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlgs(); });
      }

      async function boot() {
        icons(); bind();
        st.week = NOW_WEEK; st.selDay = (new Date().getDay() + 6) % 7;
        try {
          const { client } = await LMS.requireTeacher();
          st.c = client;
          await Promise.all([loadClasses(), loadBlocked()]);
          await Promise.all([loadWeek(), loadMats()]); render();
        } catch (e) {
          $('grid-body').innerHTML = `<tr><td colspan="8" class="p-6 text-center text-rose-700 text-sm">${esc(LMS.friendlyError(e))}</td></tr>`;
        }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
  </script>
</body>
</html>
