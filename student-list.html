<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student List | Danh sách học viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{sky:{50:"rgb(var(--sky-50) / <alpha-value>)",100:"rgb(var(--sky-100) / <alpha-value>)",200:"rgb(var(--sky-200) / <alpha-value>)",300:"rgb(var(--sky-300) / <alpha-value>)",400:"rgb(var(--sky-400) / <alpha-value>)",500:"rgb(var(--sky-500) / <alpha-value>)",600:"rgb(var(--sky-600) / <alpha-value>)",700:"rgb(var(--sky-700) / <alpha-value>)",800:"rgb(var(--sky-800) / <alpha-value>)",900:"rgb(var(--sky-900) / <alpha-value>)"}}}}}</script>
  <script src="https://unpkg.com/lucide@0.462.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lms.css">
  <script src="lms.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative">
  <nav id="lms-nav" aria-label="Điều hướng chính">
    <div class="nav-brand"><i data-lucide="graduation-cap" style="width:26px;height:26px"></i><span>gblearning</span></div>
    <a href="index.html" aria-label="Tổng quan"><i data-lucide="layout-dashboard"></i><span>Tổng quan</span></a>
    <a href="student-list.html" aria-current="page" aria-label="Học viên"><i data-lucide="users"></i><span>Học viên</span></a>
    <a href="index.html#lib" aria-label="Học liệu"><i data-lucide="library"></i><span>Học liệu</span></a>
  </nav>

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="w-full max-w-none mx-auto px-3 sm:px-5 lg:px-7 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white"><i data-lucide="users" class="w-4 h-4"></i></div>
        <h1 class="text-base font-bold text-slate-900">Danh sách học viên</h1>
      </div>
      <div class="header-tools flex items-center gap-2">
        <button id="btn-theme" type="button" aria-label="Tùy chỉnh màu chủ đề" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="palette" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-none mx-auto px-3 sm:px-5 lg:px-7 py-4 sm:py-6 space-y-6">
    <section class="panel-overview rounded-2xl p-5 sm:p-6" aria-label="Tổng quan học viên">
      <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-4"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Tổng quan</span></h3>
      <div class="grid grid-cols-3 gap-3">
        <div class="stat-tile"><div class="stat-n" id="total-count">–</div><div class="stat-l">Tổng học viên</div></div>
        <div class="stat-tile"><div class="stat-n" id="assigned-count">–</div><div class="stat-l">Đã xếp lớp</div></div>
        <div class="stat-tile"><div class="stat-n" id="unassigned-count">–</div><div class="stat-l">Chưa xếp lớp</div></div>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6" aria-label="Danh sách">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
        <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2 whitespace-nowrap"><i data-lucide="list" class="w-4 h-4"></i><span>Học viên</span></h3>
        <div class="flex flex-col sm:flex-row sm:flex-wrap gap-2 sm:items-center">
          <input id="search" type="search" class="field w-full sm:w-56" placeholder="Tìm tên, mã hoặc lớp" aria-label="Tìm học viên">
          <select id="filter-class" class="field w-full sm:w-52" aria-label="Lọc theo lớp"></select>
          <button id="btn-add" type="button" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>Thêm học viên</span></button>
          <button id="btn-export" type="button" class="btn-soft" aria-label="Xuất CSV"><i data-lucide="download" class="w-4 h-4"></i><span>Xuất CSV</span></button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="stack w-full text-left text-sm">
          <thead>
            <tr class="text-[11px] text-slate-400 font-bold border-b border-slate-100">
              <th class="py-2.5 px-2">Học viên</th>
              <th class="py-2.5 px-2">Lớp</th>
              <th class="py-2.5 px-2">Học phí tháng</th>
              <th class="py-2.5 px-2">Trạng thái</th>
              <th class="py-2.5 px-2">Ghi chú</th>
              <th class="py-2.5 px-2 text-right">Thao tác</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <section id="editor" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6" aria-label="Thêm hoặc sửa học viên">
      <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2 mb-4"><i data-lucide="user-plus" class="w-4 h-4"></i><span id="editor-title">Thêm học viên</span></h3>
      <form id="student-form" novalidate class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="hidden" id="student-id">
        <div>
          <label class="field-label" for="student-name">Họ tên</label>
          <input id="student-name" type="text" class="field w-full" autocomplete="off" required>
        </div>
        <div>
          <label class="field-label" for="student-class">Lớp</label>
          <select id="student-class" class="field w-full"></select>
        </div>
        <div>
          <label class="field-label" for="student-status">Trạng thái</label>
          <select id="student-status" class="field w-full">
            <option value="active">Đang học</option>
            <option value="inactive">Tạm ngưng</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="student-tuition">Học phí hàng tháng (đồng)</label>
          <input id="student-tuition" type="text" inputmode="numeric" class="field w-full" placeholder="0" autocomplete="off">
        </div>
        <div class="sm:col-span-2">
          <label class="field-label" for="student-note">Ghi chú</label>
          <textarea id="student-note" class="field w-full"></textarea>
        </div>
        <div id="code-row" class="sm:col-span-2 hidden text-xs text-slate-500">Mã học viên: <span id="code-view" class="code-chip"></span></div>
        <div class="sm:col-span-2 flex flex-wrap items-center gap-3">
          <button type="submit" id="btn-save" class="btn-primary"><i data-lucide="save" class="w-4 h-4"></i><span>Lưu</span></button>
          <button type="button" id="btn-cancel" class="btn-soft">Hủy</button>
          <span id="form-msg" role="alert" class="text-sm text-rose-700"></span>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const esc = LMS.esc;
      const state = { client: null, classes: [], students: [], q: '', cls: 'all', busy: false };

      const natural = (a, b) => String(a).localeCompare(String(b), 'vi', { numeric: true });
      const vnd = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
      const classOf = s => state.classes.find(c => c.id === s.class_id);
      const find = id => state.students.find(s => s.id === Number(id));
      const icons = () => { if (window.lucide) lucide.createIcons(); };

      function setMsg(t) { $('form-msg').textContent = t || ''; }

      async function load() {
        const [c, s] = await Promise.all([
          state.client.from('classes').select('id,class_code,class_name').order('class_code'),
          state.client.from('students').select('id,student_code,student_name,class_id,is_active,note,monthly_tuition').order('id')
        ]);
        if (c.error) throw c.error;
        if (s.error) throw s.error;
        state.classes = (c.data || []).slice().sort((a, b) => natural(a.class_code, b.class_code));
        state.students = (s.data || []).map(r => Object.assign({}, r, { monthly_tuition: Number(r.monthly_tuition || 0) }));
      }

      function fillClassSelects() {
        const opts = state.classes.map(c => `<option value="${c.id}">${esc(c.class_name)}</option>`).join('');
        const f = $('filter-class'), old = f.value || 'all';
        f.innerHTML = '<option value="all">Tất cả lớp</option><option value="none">Chưa xếp lớp</option>' + opts;
        f.value = [...f.options].some(o => o.value === old) ? old : 'all';
        const e = $('student-class'), oldE = e.value;
        e.innerHTML = '<option value="">Chưa xếp lớp</option>' + opts;
        e.value = [...e.options].some(o => o.value === oldE) ? oldE : '';
      }

      function visible() {
        const q = state.q.trim().toLowerCase(), f = $('filter-class').value;
        return state.students.filter(s => {
          const cls = classOf(s);
          const hay = (s.student_name + ' ' + s.student_code + ' ' + (cls ? cls.class_name : '')).toLowerCase();
          if (q && !hay.includes(q)) return false;
          if (f === 'all') return true;
          if (f === 'none') return !s.class_id;
          return String(s.class_id) === f;
        }).sort((a, b) => {
          const ca = classOf(a), cb = classOf(b);
          if (!ca && cb) return 1; if (ca && !cb) return -1;
          return (ca && cb ? natural(ca.class_code, cb.class_code) : 0) || (a.id - b.id);
        });
      }

      function render() {
        fillClassSelects();
        const all = state.students;
        $('total-count').textContent = all.length;
        $('assigned-count').textContent = all.filter(s => s.class_id).length;
        $('unassigned-count').textContent = all.filter(s => !s.class_id).length;
        const list = visible();
        if (!list.length) {
          $('rows').innerHTML = '<tr><td colspan="6" class="py-6 px-2 text-center text-slate-400 text-sm">Không có học viên phù hợp.</td></tr>';
          return icons();
        }
        $('rows').innerHTML = list.map(s => {
          const cls = classOf(s);
          const clsCell = cls ? `<a href="class.html?class=${encodeURIComponent(cls.class_code)}" class="text-sky-700 underline">${esc(cls.class_name)}</a>` : 'Chưa xếp lớp';
          return `<tr class="hover:bg-slate-50/60">
            <td class="cell-main py-3 px-2">
              <a href="student.html#${encodeURIComponent(s.student_code)}" target="_blank" rel="noopener" class="inline-flex items-center font-semibold text-sm text-sky-700 hover:underline" style="min-height:44px">${esc(s.student_name)}</a>
              <div class="code-chip mt-0.5"><span>${esc(s.student_code)}</span>
                <button type="button" class="icon-btn" style="width:32px;height:32px" data-act="copy" data-id="${s.id}" aria-label="Sao chép mã ${esc(s.student_name)}"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
              </div>
            </td>
            <td class="py-3 px-2 text-xs text-slate-600">${clsCell}</td>
            <td class="py-3 px-2 text-xs font-semibold text-slate-700">${vnd(s.monthly_tuition)}</td>
            <td class="py-3 px-2"><span class="text-[11px] px-2 py-1 rounded-full ${s.is_active ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${s.is_active ? 'Đang học' : 'Tạm ngưng'}</span></td>
            <td class="py-3 px-2 text-xs text-slate-500">${esc(s.note || '—')}</td>
            <td class="cell-actions py-3 px-2"><div class="flex justify-end">
              <button type="button" class="icon-btn" data-act="edit" data-id="${s.id}" aria-label="Sửa ${esc(s.student_name)}"><i data-lucide="pencil" class="w-4 h-4"></i></button>
              <button type="button" class="icon-btn danger" data-act="delete" data-id="${s.id}" aria-label="Xóa ${esc(s.student_name)}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div></td>
          </tr>`;
        }).join('');
        icons();
      }

      function resetForm() {
        $('student-form').reset();
        $('student-id').value = ''; $('student-tuition').value = '';
        $('editor-title').textContent = 'Thêm học viên';
        $('code-row').classList.add('hidden'); setMsg('');
      }

      function edit(id) {
        const s = find(id); if (!s) return;
        $('student-id').value = s.id;
        $('student-name').value = s.student_name;
        $('student-class').value = s.class_id ? String(s.class_id) : '';
        $('student-status').value = s.is_active ? 'active' : 'inactive';
        $('student-note').value = s.note || '';
        $('student-tuition').value = Number(s.monthly_tuition || 0).toLocaleString('en-US');
        $('editor-title').textContent = 'Sửa học viên';
        $('code-view').textContent = s.student_code; $('code-row').classList.remove('hidden'); setMsg('');
        $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
        $('student-name').focus({ preventScroll: true });
      }

      async function reload(msg) {
        try { await load(); render(); if (msg) LMS.toast(msg); }
        catch (e) { setMsg(LMS.friendlyError(e)); }
      }

      async function onSubmit(ev) {
        ev.preventDefault();
        if (state.busy) return;
        const name = $('student-name').value.trim();
        if (!name) { setMsg('Nhập họ tên học viên.'); $('student-name').focus(); return; }
        const classId = $('student-class').value;
        const payload = {
          student_name: name,
          class_id: classId ? Number(classId) : null,
          is_active: $('student-status').value === 'active',
          note: $('student-note').value.trim() || null,
          monthly_tuition: Math.max(0, Number(String($('student-tuition').value).replace(/\D/g, '') || 0))
        };
        const id = $('student-id').value;
        state.busy = true; $('btn-save').disabled = true; setMsg('');
        const res = id
          ? await state.client.from('students').update(payload).eq('id', Number(id))
          : await state.client.from('students').insert(payload);
        state.busy = false; $('btn-save').disabled = false;
        if (res.error) {
          setMsg(res.error.code === '23505' ? 'Học viên này đã có trong lớp đã chọn.' : LMS.friendlyError(res.error));
          return;
        }
        resetForm();
        await reload(id ? 'Đã cập nhật học viên.' : 'Đã thêm học viên.');
      }

      async function remove(id) {
        const s = find(id); if (!s) return;
        if (!confirm(`Xóa "${s.student_name}" khỏi danh sách?`)) return;
        const res = await state.client.from('students').delete().eq('id', s.id);
        if (res.error) {
          if (res.error.code === '23503') {
            if (confirm(`"${s.student_name}" đã có bài nộp nên không thể xóa (để giữ điểm). Chuyển sang Tạm ngưng?`)) {
              const u = await state.client.from('students').update({ is_active: false }).eq('id', s.id);
              if (u.error) { alert(LMS.friendlyError(u.error)); return; }
              await reload('Đã chuyển sang Tạm ngưng.');
            }
            return;
          }
          alert(LMS.friendlyError(res.error)); return;
        }
        await reload('Đã xóa học viên.');
      }

      async function copyCode(id) {
        const s = find(id); if (!s) return;
        try { await navigator.clipboard.writeText(s.student_code); LMS.toast('Đã sao chép mã ' + s.student_code); }
        catch (e) { LMS.toast('Không sao chép được. Mã: ' + s.student_code); }
      }

      function exportCsv() {
        const rows = [['Mã học viên', 'Họ tên', 'Lớp', 'Học phí hàng tháng (VND)', 'Trạng thái', 'Ghi chú']]
          .concat(visible().map(s => [s.student_code, s.student_name, (classOf(s) || {}).class_name || '', s.monthly_tuition || 0, s.is_active ? 'Đang học' : 'Tạm ngưng', s.note || '']));
        const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = 'student-list.csv'; a.click(); URL.revokeObjectURL(a.href);
      }

      function bind() {
        $('search').addEventListener('input', e => { state.q = e.target.value; render(); });
        $('filter-class').addEventListener('change', render);
        $('btn-add').addEventListener('click', () => { resetForm(); $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('student-name').focus({ preventScroll: true }); });
        $('btn-export').addEventListener('click', exportCsv);
        $('btn-cancel').addEventListener('click', resetForm);
        $('student-form').addEventListener('submit', onSubmit);
        const tuition = $('student-tuition');
        tuition.addEventListener('focus', () => tuition.select());
        tuition.addEventListener('input', () => { const d = tuition.value.replace(/\D/g, ''); tuition.value = d ? Number(d).toLocaleString('en-US') : ''; });
        $('rows').addEventListener('click', e => {
          const b = e.target.closest('[data-act]'); if (!b) return;
          const act = b.dataset.act, id = b.dataset.id;
          if (act === 'edit') edit(id); else if (act === 'delete') remove(id); else if (act === 'copy') copyCode(id);
        });
      }

      async function boot() {
        icons(); bind();
        $('rows').innerHTML = '<tr><td colspan="6" class="py-6 px-2 text-center text-slate-400 text-sm">Đang tải danh sách...</td></tr>';
        try {
          const { client } = await LMS.requireTeacher();
          state.client = client;
          await load();
          render();
        } catch (e) {
          $('rows').innerHTML = `<tr><td colspan="6" class="py-6 px-2 text-center text-rose-700 text-sm">${esc(LMS.friendlyError(e))}</td></tr>`;
        }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
  </script>
</body>
</html>
