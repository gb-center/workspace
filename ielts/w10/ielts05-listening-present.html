<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test 05 - Listening Presentation</title>
<style>
:root{--pri:#16181D;--ink:#1B1D22;--panel:#F4F5F7;--line:#E4E6EA;--g1:#e5c16b;--g2:#b38324;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b;--mut:#6b6f78}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.35;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{display:block}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--pri);color:#fff;font-weight:600;font-size:16px}
.pill.ghost{background:var(--panel);color:var(--ink)}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.ib.dark{background:var(--pri);color:#fff}
.ib.on{background:var(--g1)}
mark.ans{background:var(--ok);color:var(--okl);font-weight:700;border-radius:6px;padding:0 8px}
/* display */
body.disp{overflow:hidden}
#D{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:2.2vh 3vw;gap:1.6vh}
#dh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#dh .ttl{font-weight:700;font-size:22px}
.tag{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:var(--panel);font-weight:700;font-size:17px}
.tag.cur{background:var(--pri);color:#fff}
#dh .sp{flex:1}
#dh small{color:var(--mut);font-size:14px}
#dot{width:12px;height:12px;border-radius:50%;background:#bbb}#dot.on{background:var(--okl)}
#da{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:20px;padding:10px 18px}
#dsk{position:relative;flex:1;height:14px}
#dsk .trk{position:absolute;left:0;right:0;top:4px;height:6px;border-radius:3px;background:var(--line)}
#dsk .fl{position:absolute;left:0;top:4px;height:6px;border-radius:3px;background:var(--pri)}
#dsk .rg{position:absolute;top:0;height:14px;border-radius:7px;background:rgba(229,193,107,.6);display:none}
#dtm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:16px;min-width:110px;text-align:right}
#dhint{font-size:20px;font-weight:600}
#db{flex:1;min-height:0;display:flex;gap:2.5vw}
#dl{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:1.4em}
#dr{width:38%;flex:none;background:var(--panel);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
#dr .n{font-size:20px;color:var(--mut)}#dr .a{font-size:44px;font-weight:700}
#dr .sc{font-size:22px;line-height:1.45}
.grp{display:flex;flex-direction:column;gap:.45em}
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gh b{display:inline-flex;height:1.9em;align-items:center;padding:0 .8em;border-radius:999px;background:var(--panel);font-size:.9em}
.gh span{color:var(--mut);font-size:.85em}
.chips{display:flex;gap:.5em;flex-wrap:wrap;font-size:.8em;color:var(--mut)}
.row{display:flex;gap:.6em;align-items:baseline;padding:.15em .4em;border-radius:12px}
.row.f{background:#fbf3dc}
.row .qn{flex:none;min-width:1.9em;height:1.9em;border-radius:50%;background:var(--panel);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.row.f .qn{background:var(--pri);color:#fff}
.opts{display:flex;gap:1.2em;flex-wrap:wrap;color:var(--mut);font-size:.9em}
.opts .c{color:var(--okl);font-weight:700}
.tg{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tg i{font-style:normal;font-size:.7em;padding:.1em .7em;border-radius:999px;background:var(--bad);color:var(--badl);font-weight:700}
#dsum{display:flex;gap:10px;flex-wrap:wrap;font-size:18px}
/* remote */
body.rem{background:#fff}
#R{max-width:560px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:10px}
.rr{display:flex;gap:6px}.rr>*{flex:1}
.seg{height:40px;border-radius:999px;border:0;background:var(--panel);font-weight:700;font-size:15px;padding:0 4px}
.seg.on{background:var(--pri);color:#fff}
#rau{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:18px;padding:8px}
#rau .ib{background:#fff;border:1px solid var(--line);width:44px;height:44px}#rau .ib.dark{background:var(--pri);border-color:var(--pri)}
#rsk{position:relative;height:36px;margin:0 2px;touch-action:none}
#rsk .trk{position:absolute;left:0;right:0;top:15px;height:6px;border-radius:3px;background:var(--line)}
#rsk .fl{position:absolute;left:0;top:15px;height:6px;border-radius:3px;background:var(--pri)}
#rsk .rg{position:absolute;top:10px;height:16px;border-radius:8px;background:rgba(229,193,107,.6);display:none}
#rtm{font-size:14px;color:var(--mut);text-align:center}
#rt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#rt button{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:16px;position:relative}
#rt button.cur{border-color:var(--pri);background:var(--panel)}
#rt button.rv{background:var(--ok);border-color:var(--okl);color:var(--okl)}
#rt button.tgd::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--badl)}
#rp{background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
#rp .t{font-weight:600;font-size:17px}#rp .a{font-size:24px;font-weight:700;color:var(--okl)}#rp .e{font-size:15px;color:var(--mut)}
.chip{height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;padding:0 14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rw{display:flex;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.card{width:min(420px,100%);border:1px solid var(--line);border-radius:20px;padding:22px}
.card input{width:100%;height:48px;font-size:20px;border:0;border-bottom:2px solid var(--line);background:var(--panel);border-radius:10px 10px 0 0;padding:0 12px;margin:10px 0;letter-spacing:.2em}
.err{color:var(--badl);font-size:15px;min-height:1.3em}
</style></head><body>
