<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Test 05 - Listening</title>
<style>
:root{--pri:#16181D;--sec:#23262D;--ink:#1B1D22;--panel:#F4F5F7;--line:#E4E6EA;--g1:#e5c16b;--g2:#b38324;--g3:#c89a3a;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b;--mut:#6b6f78}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#hd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:6px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:16px;white-space:nowrap}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tab small{font-size:13px;opacity:.75;margin-left:6px}
.tools{display:flex;align-items:center;gap:8px}
.who{font-size:14px;color:var(--mut);white-space:nowrap}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.ib.dark{background:var(--pri);color:#fff}
.ib:disabled{opacity:.35}
.ib.on{background:var(--g1)}
#au{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#au .ib{background:#fff;border:1px solid var(--line)}
#au .ib.dark{background:var(--pri);border-color:var(--pri)}
#sk{position:relative;flex:1;min-width:60px;height:44px;touch-action:none;cursor:pointer}
#sk .trk{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:var(--line)}
#sk .fl{position:absolute;left:0;top:19px;height:6px;border-radius:3px;background:var(--pri);width:0}
#sk .rg{position:absolute;top:15px;height:14px;border-radius:7px;background:var(--g1);opacity:.7;display:none}
#sk .ph{position:absolute;top:13px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:3px solid var(--pri);left:0}
.tm{font-size:14px;color:var(--mut);white-space:nowrap;min-width:84px;text-align:center}

.spd{height:44px;min-width:56px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px}

.t{min-width:36px;height:34px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;flex:none;line-height:1}
.t.on{border-color:var(--pri);background:var(--panel)}
.t.ok{background:var(--ok);border-color:var(--okl);color:var(--okl)}
.t.bad{background:var(--bad);border-color:var(--badl);color:var(--badl)}
.t.cur{box-shadow:none;outline:2px solid var(--g3);outline-offset:1px}
#pg{flex:1;min-height:0;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
#pg.sc{overflow-y:auto}
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gp{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--panel);font-weight:700;font-size:15px}
.gp svg{width:18px;height:18px}
.gi{font-size:16px}
.gn{font-size:14px;color:var(--mut);flex-basis:100%}
.blk{display:flex;flex-direction:column;gap:6px}
.ttl{font-weight:700;font-size:17px;text-align:center;padding:2px 0}
.qi{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pre,.post{font-size:16px}
.qn{flex:none;min-width:30px;height:30px;border-radius:999px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
input.gap{flex:1;min-width:0;height:44px;border:0;border-bottom:2px solid var(--line);background:var(--panel);border-radius:10px 10px 0 0;padding:0 12px;font-size:18px;outline:0}
input.gap:focus{border-bottom-color:var(--g3)}
input.gap:disabled{opacity:1;color:var(--ink)}
input.gap.ok{background:var(--ok);border-bottom-color:var(--okl)}
input.gap.bad{background:var(--bad);border-bottom-color:var(--badl)}
.frm{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 12px;align-items:center}
.frm .lb{font-weight:600;font-size:16px}
.frm .st{font-size:17px}
table.tb{width:100%;border-collapse:separate;border-spacing:0 6px;table-layout:auto}
table.tb th{text-align:left;font-size:14px;color:var(--mut);font-weight:700;padding:0 8px}
table.tb td{padding:6px 8px;background:var(--panel);vertical-align:middle;font-size:16px}
table.tb td:first-child{border-radius:12px 0 0 12px}table.tb td:last-child{border-radius:0 12px 12px 0}
table.tb td .qi{gap:6px}
table.tb input.gap{background:#fff;font-size:17px;height:40px;min-width:70px}
table.tb input.gap.ok{background:var(--ok)}table.tb input.gap.bad{background:var(--bad)}
.mq{display:flex;flex-direction:column;gap:6px}
.stem{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;text-align:left;font-size:16px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--panel)}
.opt.sel b{background:var(--pri);color:#fff}
.opt.ok{background:var(--ok);border-color:var(--okl)}.opt.ok b{background:var(--okl);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--badl)}.opt.bad b{background:var(--badl);color:#fff}
.opt:disabled{opacity:1}
.sentr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0}
.sentr .qi{flex:1 1 150px}
.lst{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:var(--panel);border-radius:14px;padding:8px 14px;font-size:15px}
.lst span b{margin-right:8px}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mrow .qi{flex:0 0 auto;min-width:150px;font-weight:600}
.ch{display:flex;gap:6px;flex-wrap:wrap}
.cb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.cb.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.cb.ok{background:var(--okl);color:#fff;border-color:var(--okl)}.cb.bad{background:var(--badl);color:#fff;border-color:var(--badl)}
.ex{font-size:15px;color:var(--mut)}
.rv{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:var(--panel)}
.rv .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.rv .mk{font-weight:700}
.rv .mk.ok{color:var(--okl)}.rv .mk.bad{color:var(--badl)}
.rv .sc{font-size:15px;color:var(--mut)}
.rv .a2{font-size:16px}
#ft{display:flex;align-items:center;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pgi{font-size:15px;color:var(--mut);min-width:56px;text-align:center;white-space:nowrap}
.sp{flex:1}
#sv{font-size:14px;color:var(--mut);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(22,24,29,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.solid{background:#fff}
.card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:6px 0;font-size:17px}
.card .score{font-size:36px;font-weight:700;margin:4px 0}
.card .muted{font-size:15px;color:var(--mut)}
.card .err{color:var(--badl)}
.card input.gap{width:100%;margin:8px 0}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hide-m{}
@media (max-width:700px){
 body{font-size:16px}
 #hd{gap:6px;padding:6px 10px}.brand{font-size:16px}
 .tabs{flex:1 1 100%;order:3}.tab{flex:1;padding:0 6px}.tab small{display:none}
 .who{display:none}
 #au{padding:6px 10px;gap:6px}.tm{min-width:0;font-size:13px}
 #tl{padding:6px 10px;gap:4px}.t{min-width:0;flex:1;padding:0}
 #pg{padding:10px}
 #ft{padding-left:10px;padding-right:10px}

 .brand{display:none}.tabs{flex:1 1 auto;order:0}

}
@media (max-width:420px){.spd{min-width:48px;padding:0 8px}}

  function doSubmit(pi) {
    var wait = modal("Submitting...", "Please wait.", []);
    rpc("submit_assignment_part", { p_student_code: state.code, p_assignment_code: D.code, p_part: D.parts[pi].id, p_answers: partAnswers(pi) })
      .then(function (j) {
        wait.remove(); state.lock[pi] = true; state.pres[pi] = { score: j.score, total: j.total, is_late: j.is_late, counts_for_score: j.counts_for_score, items: j.items };
        j.items.forEach(function (x) { state.byId[x.id] = x.correct; });
        state.open = state.open.filter(function (x) { return x !== pi; });
        saveNow(false); state.review = false; paintAll(); showResult(pi, j);
      }).catch(function (e) { wait.remove(); modal("Could not submit", errText(e), [{ t: "OK" }]); });
  }
  function showResult(pi, j) {
    var left = 0; D.parts.forEach(function (P, i) { if (!locked(i)) left++; });
    var body = h("div", null, h("p", { cls: "score", text: j.score + " / " + j.total }),
      h("p", { text: j.counts_for_score ? "This is your first attempt at this part, so this score counts." : "This is a retake. Only your first attempt at each part counts for your score." }),
      j.is_late ? h("p", { cls: "err", text: "Submitted after the deadline (marked as late)." }) : null,
      h("p", { cls: "muted", text: "Green is correct, red is wrong. Open the book icon to see the script and answers." + (left ? " " + left + " part" + (left > 1 ? "s" : "") + " left to submit." : " You have submitted all parts.") }));
    var next = -1; for (var i = 0; i < D.parts.length; i++) if (!locked(i)) { next = i; break; }
    var btns = [{ t: "Review", ghost: true, f: function () { state.review = true; state.pg = 0; paintAll(); } }];
    if (next > -1) btns.push({ t: "Next part", f: function () { goPart(next); } });
    modal("Part " + D.parts[pi].id + " result", body, btns);
  }
  function retry(pi) {
    nums(pi).forEach(function (n) { delete state.ans[n]; delete state.byId["q" + n]; });
    state.lock[pi] = false; delete state.pres[pi]; if (state.open.indexOf(pi) < 0) state.open.push(pi);
    state.review = false; state.pg = 0; saveNow(false); paintAll();
  }
  function retakeAll() {
    var any = false; D.parts.forEach(function (P, i) { if (locked(i)) any = true; });
    if (!any) { modal("Nothing to retake yet", "Submit at least one part first.", [{ t: "OK" }]); return; }
    modal("Retake the whole test?", "All your answers will be cleared. Only your first full attempt counts for your score; retakes do not count.",
      [{ t: "Cancel", ghost: true }, { t: "Retake", f: function () {
        D.parts.forEach(function (P, pi) { nums(pi).forEach(function (n) { delete state.ans[n]; delete state.byId["q" + n]; }); state.lock[pi] = false; delete state.pres[pi]; if (state.open.indexOf(pi) < 0) state.open.push(pi); });
        state.review = false; goPart(0); saveNow(false);
      } }]);
  }
  function goPart(pi) { state.pi = pi; state.pg = 0; state.review = false; setAudio(pi); paintAll(); }

  /* ---------- login ---------- */
  function login() {
    var qc = ""; try { qc = (new URLSearchParams(location.search).get("s") || decodeURIComponent((location.hash || "").slice(1))).trim(); } catch (e) { }
    function start(c, ov, msg) {
      c = String(c || "").trim(); if (!c) { if (msg) msg.textContent = "Please enter your code."; return; }
      if (msg) msg.textContent = "Checking...";
      rpc("student_assignment", { p_student_code: c, p_assignment_code: D.code }).then(function (j) {
        state.code = c; state.sname = j.student_name || ""; store("sc", c);
        return rpc("get_progress", { p_student_code: c, p_assignment_code: D.code }).then(function (pg) {
          $("#who").textContent = state.sname; loadProgress(pg); if (ov) ov.remove();
          if (qc) { try { history.replaceState(null, "", location.pathname); } catch (e) { } }
        });
      }).catch(function (e) {
        if (msg) { msg.textContent = errText(e); return; }
        var err = h("div", { cls: "ov solid" }, h("div", { cls: "card" }, h("h3", { text: D.title }), h("p", { cls: "err", text: errText(e) }),
          h("div", { cls: "brow" }, h("button", { cls: "pill", text: "Try again", onclick: function () { err.remove(); store("sc", ""); qc = ""; try { history.replaceState(null, "", location.pathname); } catch (x) { } login(); } }))));
        document.body.appendChild(err);
      });
    }
    if (qc) { start(qc, null, null); return; }
    var inp = h("input", { cls: "gap", type: "text", autocomplete: "off", spellcheck: "false", placeholder: "Student code", "aria-label": "Student code" });
    inp.value = store("sc") || "";
    var msg = h("p", { cls: "err", text: "" });
    var ov = h("div", { cls: "ov solid" }, h("div", { cls: "card" }, h("h3", { text: D.title }), h("p", { text: "Enter your student code to start the test." }), inp, msg,
      h("div", { cls: "brow" }, h("button", { cls: "pill", text: "Start", onclick: function () { start(inp.value, ov, msg); } }))));
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") start(inp.value, ov, msg); });
    document.body.appendChild(ov); setTimeout(function () { inp.focus(); }, 50);
  }

  /* ---------- boot ---------- */
  function boot() {
    var tabs = h("nav", { cls: "tabs" });
    D.parts.forEach(function (P, i) { tabs.appendChild(h("button", { cls: "tab", onclick: function () { goPart(i); } })); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "who", cls: "who" }), ibtn("reset", "Retake the whole test", retakeAll));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    buildAudio(); setAudio(0); paintAll();
    var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { var q = null; paintAll(); }, 150); });
    login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body></html>
