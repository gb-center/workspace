<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 05 - Writing</title>
<style>
:root{--fs:18px;--ink:#111;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3;--ok:#e3f3e6;--okl:#2e7d4f;--bad:#fbe6e6;--badl:#b42b2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:grid;grid-template-rows:56px 1fr}
#hd{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:15px 14px 13px;font-size:16px;border-bottom:3px solid transparent;color:var(--mut)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px}
.who2{font-size:14px;color:var(--mut);margin-right:6px}
.ib,.fsb,.tm{height:38px;min-width:38px;border:0;border-radius:19px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.fsb,.tm{font-weight:700;font-size:15px}
.tm.on{background:#111;color:#fff}
.ib.dark{background:#111;color:#fff}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:56px;text-align:center}
.clock.over{color:var(--badl)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mv{display:none}
#main{--lw:48%;display:flex;min-height:0}
#task{width:var(--lw);overflow:auto;padding:24px 28px 60px;min-width:0}
#split{width:10px;cursor:col-resize;background:var(--soft);flex:none;position:relative;touch-action:none}
#split:after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:#bdbdbd}
#work{flex:1;display:flex;flex-direction:column;min-width:0;padding:24px 28px 16px}
.ptag{font-size:14px;color:var(--mut);margin-bottom:4px}
h2{margin:0 0 14px;font-size:calc(var(--fs) + 8px);line-height:1.25}
.tp{font-size:var(--fs);line-height:1.6;margin:0 0 12px;text-align:justify}
.tp.hint{color:var(--mut);font-size:16px}
.tp b{font-weight:700}
.q{font-weight:700}
#fig{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:block}
#ta{flex:1;min-height:0;width:100%;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;font:inherit;font-size:var(--fs);line-height:1.6;outline:none;color:var(--ink);background:#fff}
#ta:focus{border-color:#111}
#ta[readonly]{background:var(--soft)}
#bar{display:flex;align-items:center;gap:12px;padding:10px 2px 0;font-size:15px;color:var(--mut)}
#wc{font-weight:700;color:var(--ink)}
#wc.low{color:var(--badl)}
#wc.ok{color:var(--okl)}
.fill{flex:1}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.5;background:var(--ok)}
.banner.fb{background:var(--soft)}
.banner b{font-weight:700}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50}
.ov.solid{background:#fff}
.card{width:min(480px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.card h3{margin:0 0 10px;font-size:22px}
.card p{margin:8px 0;line-height:1.5;font-size:16px}
.card p.muted{color:var(--mut);font-size:15px}
.err{color:var(--badl)}
.gap{font:inherit;font-size:17px;border:0;border-bottom:2px solid #111;background:var(--soft);padding:10px 12px;margin:10px 0;width:100%;border-radius:6px 6px 0 0;outline:none}
.brow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.pill{white-space:nowrap;border:0;border-radius:22px;background:#111;color:#fff;height:44px;padding:0 24px;font-size:16px;font-weight:600}
.pill.ghost{background:var(--soft);color:#111}
@media (max-width:900px){#main{flex-direction:column}#task{width:100%;height:42%}#split{display:none}.brand{display:none}}
@media (max-width:700px){#app{grid-template-rows:auto 1fr}#hd{height:auto;flex-wrap:wrap;gap:4px 8px;padding:6px 10px}.tabs{order:3;flex:1 0 100%;margin:0}.tab{flex:1;padding:8px 6px}.tools{margin-left:auto;flex-wrap:wrap;gap:4px}.who2,.hide-m{display:none}#main[data-v="t"] #work,#main[data-v="w"] #task{display:none}#task,#work{width:100%;flex:1;min-height:0}#task{padding:14px 16px 24px}#work{padding:12px 16px 10px}.mv{display:flex;order:4;flex:1 0 100%;gap:8px;padding-bottom:6px}.mvb{flex:1;height:38px;border:0;border-radius:19px;background:var(--soft);font-size:15px;font-weight:600}.mvb.on{background:#111;color:#fff}.card{padding:20px}.brow{flex-wrap:wrap}.sep{display:none}}
</style></head>

    state.running = true; $("#pp").innerHTML = ICON.pause;
    state.tick = setInterval(function () { state.left -= 1; paintClock(); if (state.left <= 0) stopClock(); }, 1000);
  }
  function paintTm() { document.querySelectorAll(".tm").forEach(function (b) { b.classList.toggle("on", +b.dataset.m === state.mins); }); }

  /* ---------- render ---------- */
  function renderTask() {
    var t = T(), box = $("#task"); box.innerHTML = "";
    box.appendChild(h("div", { cls: "ptag", text: "Writing " + t.name }));
    box.appendChild(h("h2", { text: t.name }));
    box.appendChild(h("p", { cls: "tp hint", text: t.time }));
    t.lines.forEach(function (l) { box.appendChild(h("p", { cls: "tp" + (l.q ? " q" : ""), text: l.t })); });
    if (t.fig) box.appendChild(h("img", { id: "fig", src: t.fig, alt: "Maps: before and after" }));
    box.appendChild(h("p", { cls: "tp hint", text: "Write at least " + t.min + " words." }));
    box.scrollTop = 0;
  }
  function renderWork() {
    var t = T(), id = t.id, box = $("#work"); box.innerHTML = "";
    var sub = state.sub[id];
    if (sub) {
      box.appendChild(h("div", { cls: "banner" }, h("b", { text: "Submitted. " }), h("span", { text: sub.word_count + " words" + (sub.is_late ? " · submitted after the deadline" : "") + ". Your teacher will review it." })));
      if (sub.feedback || sub.band != null) {
        var f = h("div", { cls: "banner fb" }, h("b", { text: "Teacher feedback" + (sub.band != null ? " · Band " + sub.band : "") }));
        if (sub.feedback) f.appendChild(h("div", { text: sub.feedback, style: "white-space:pre-wrap;margin-top:6px" }));
        box.appendChild(f);
      }
    }
    var ta = h("textarea", { id: "ta", spellcheck: "true", "aria-label": "Your answer", placeholder: "Type your answer here..." });
    ta.value = state.text[id] || ""; if (sub) ta.readOnly = true;
    ta.addEventListener("input", function () { state.text[id] = ta.value; paintWc(); scheduleSave(); });
    box.appendChild(ta);
    box.appendChild(h("div", { id: "bar" }, h("span", { id: "wc" }), h("span", { id: "need", text: "of at least " + t.min + " words" }), h("span", { cls: "fill" })));
    paintWc();
  }
  function paintWc() {
    var t = T(), n = wc(state.text[t.id]), e = $("#wc"); e.textContent = n + " words";
    e.className = n === 0 ? "" : (n >= t.min ? "ok" : "low");
  }
  function paintTabs() {
    document.querySelectorAll(".tab").forEach(function (b, i) { b.classList.toggle("on", i === state.p); b.textContent = D.tasks[i].name + (state.sub[D.tasks[i].id] ? "  ✓" : ""); });
  }
  function paint() { paintTabs(); renderTask(); renderWork(); }

  /* ---------- server ---------- */
  function rpc(fn, body, keep) {
    return fetch(D.sb.url + "/rest/v1/rpc/" + fn, { method: "POST", keepalive: !!keep, headers: { "Content-Type": "application/json", apikey: D.sb.key }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && (j.message || j.hint)) || "error"); return j; }); });
  }
  function errText(e) {
    var m = String(e && e.message || e);
    if (m.indexOf("student_not_found") > -1) return "Student code not found. Please check it and try again.";
    if (m.indexOf("assignment_not_found") > -1) return "This task has not been assigned to your class.";
    if (m.indexOf("already_submitted") > -1) return "This task was already submitted.";
    return "Could not reach the server. Check your internet connection and try again.";
  }
  function draftBody() { var o = {}; D.tasks.forEach(function (t) { if (!state.sub[t.id] && state.text[t.id]) o["t" + t.id] = state.text[t.id]; }); return o; }
  function setSave(t) { var e = $("#sv"); if (e) e.textContent = t; }
  function scheduleSave() {
    if (!state.code || state.loading) return;
    var cur = JSON.stringify(draftBody()); if (cur === state.saved) return;
    setSave("Saving..."); clearTimeout(state.timer); state.timer = setTimeout(function () { saveNow(false); }, 1500);
  }
  function saveNow(keep) {
    if (!state.code) return Promise.resolve();
    clearTimeout(state.timer);
    var body = draftBody(), cur = JSON.stringify(body); if (cur === state.saved) { return Promise.resolve(); }
    return rpc("save_draft", { p_student_code: state.code, p_assignment_code: D.code, p_answers: body }, keep)
      .then(function () { state.saved = cur; setSave("Saved"); }).catch(function () { setSave("Not saved"); });
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveNow(true); });
  window.addEventListener("pagehide", function () { saveNow(true); });
  function loadProgress(pg) {
    state.loading = true; var d = pg.draft || {};
    D.tasks.forEach(function (t) { state.text[t.id] = d["t" + t.id] || ""; });
    (pg.parts || []).forEach(function (x) { state.sub[x.part] = x; state.text[x.part] = x.body; });
    var first = 0; for (var i = 0; i < D.tasks.length; i++) { if (!state.sub[D.tasks[i].id]) { first = i; break; } }
    state.p = first; state.mins = T().mins; state.left = state.mins * 60;
    state.saved = JSON.stringify(draftBody()); state.loading = false; paint(); paintClock(); paintTm();
  }

  /* ---------- modal, submit ---------- */
  function modal(title, body, btns) {
    var ov = h("div", { cls: "ov" }), card = h("div", { cls: "card" }, h("h3", { text: title }));
    if (typeof body === "string") card.appendChild(h("p", { text: body })); else if (body) card.appendChild(body);
    var row = h("div", { cls: "brow" });
    btns.forEach(function (b) { row.appendChild(h("button", { cls: "pill" + (b.ghost ? " ghost" : ""), text: b.t, onclick: function () { ov.remove(); if (b.f) b.f(); } })); });
    card.appendChild(row); ov.appendChild(card); document.body.appendChild(ov); return ov;
  }
  function submit() {
    var t = T(), id = t.id; if (state.sub[id]) return;
    var n = wc(state.text[id]);
    if (n === 0) { modal("Nothing to submit", "Please write your answer first.", [{ t: "OK" }]); return; }
    modal("Submit " + t.name + "?", (n < t.min ? "Your text has " + n + " words, which is below the minimum of " + t.min + ". " : "") + "You cannot change your answer after submitting.",
      [{ t: "Keep writing", ghost: true }, { t: "Submit", f: function () { doSubmit(t); } }]);
  }
  function doSubmit(t) {
    var wait = modal("Submitting...", "Please wait.", []);
    rpc("submit_writing", { p_student_code: state.code, p_assignment_code: D.code, p_part: t.id, p_text: state.text[t.id] })
      .then(function (j) {
        wait.remove(); stopClock();
        state.sub[t.id] = { part: t.id, body: state.text[t.id], word_count: j.word_count, is_late: j.is_late, feedback: null, band: null };
        saveNow(false); paint();
        var left = D.tasks.filter(function (x) { return !state.sub[x.id]; });
        modal(t.name + " submitted", j.word_count + " words." + (j.is_late ? " Submitted after the deadline." : "") + (left.length ? " " + left.length + " task left." : " You have submitted both tasks."),
          [{ t: "OK", ghost: !left.length }].concat(left.length ? [{ t: "Next task", f: function () { switchTo(D.tasks.indexOf(left[0])); } }] : []));
      }).catch(function (e) { wait.remove(); modal("Could not submit", errText(e), [{ t: "OK" }]); });
  }
  function setView(v) { $("#main").setAttribute("data-v", v); document.querySelectorAll(".mvb").forEach(function (b) { b.classList.toggle("on", b.dataset.v === v); }); }
  function switchTo(i) { state.p = i; if (!state.running) setMins(D.tasks[i].mins); paint(); }

  /* ---------- login ---------- */
  function login() {
    var inp = h("input", { cls: "gap", type: "text", autocomplete: "off", spellcheck: "false", placeholder: "Student code", "aria-label": "Student code" });
    var hc = decodeURIComponent((location.hash || "").slice(1)).trim();
    inp.value = hc || store("sc") || "";
    var msg = h("p", { cls: "err", text: "" });
    var ov = h("div", { cls: "ov solid" }, h("div", { cls: "card" }, h("h3", { text: D.title }), h("p", { text: "Enter your student code to start." }), inp, msg,
      h("div", { cls: "brow" }, h("button", { cls: "pill", text: "Start", onclick: go1 }))));
    function go1() {
      var c = inp.value.trim(); if (!c) { msg.textContent = "Please enter your code."; return; }
      msg.textContent = "Checking...";
      rpc("get_writing_progress", { p_student_code: c, p_assignment_code: D.code }).then(function (pg) {
        state.code = c; state.sname = pg.student_name || ""; store("sc", c); $("#who").textContent = state.sname; loadProgress(pg); ov.remove();
      }).catch(function (e) { msg.textContent = errText(e); });
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go1(); });
    document.body.appendChild(ov); setTimeout(function () { inp.focus(); }, 50);
    if (hc) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { } go1(); }
  }

  /* ---------- chrome ---------- */
  function fontStep(d) { var cur = parseFloat(store("fs") || "18"); cur = Math.max(14, Math.min(30, cur + d)); store("fs", String(cur)); document.documentElement.style.setProperty("--fs", cur + "px"); }
  function setupSplit() {
    var sp = $("#split"), main = $("#main"), drag = false;
    sp.addEventListener("pointerdown", function (e) { drag = true; sp.setPointerCapture(e.pointerId); });
    sp.addEventListener("pointermove", function (e) { if (!drag) return; var r = main.getBoundingClientRect(), p = ((e.clientX - r.left) / r.width) * 100; main.style.setProperty("--lw", Math.max(25, Math.min(70, p)) + "%"); });
    sp.addEventListener("pointerup", function () { drag = false; });
  }
  function boot() {
    document.documentElement.style.setProperty("--fs", parseFloat(store("fs") || "18") + "px");
    var tabs = h("nav", { cls: "tabs" });
    D.tasks.forEach(function (t, i) { tabs.appendChild(h("button", { cls: "tab" + (i === 0 ? " on" : ""), text: t.name, onclick: function () { switchTo(i); } })); });
    var tools = h("div", { cls: "tools" }, h("span", { id: "sv", cls: "who2" }), h("span", { id: "who", cls: "who2" }),
      h("button", { cls: "tm", "data-m": "20", text: "20", title: "20 minutes", onclick: function () { setMins(20); } }),
      h("button", { cls: "tm", "data-m": "40", text: "40", title: "40 minutes", onclick: function () { setMins(40); } }),
      h("span", { id: "clock", cls: "clock", text: "20:00" }),
      h("button", { id: "pp", cls: "ib", title: "Start or pause the timer", "aria-label": "Start or pause the timer", html: ICON.play, onclick: toggleClock }),
      ibtn("reset", "Reset the timer", function () { setMins(state.mins); }),
      h("span", { cls: "sep" }),
      h("button", { cls: "fsb", text: "A−", title: "Smaller text", onclick: function () { fontStep(-1); } }),
      h("button", { cls: "fsb", text: "A+", title: "Larger text", onclick: function () { fontStep(1); } }),
      ibtn("full", "Full screen", function () { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { } }, "hide-m"),
      ibtn("tick", "Submit this task", submit, "dark"));
    $("#hd").appendChild(h("div", { cls: "brand", text: D.title })); $("#hd").appendChild(tabs); $("#hd").appendChild(tools);
    var mv = h("div", { cls: "mv" }); [["t", "Prompt"], ["w", "Answer"]].forEach(function (v) { mv.appendChild(h("button", { cls: "mvb" + (v[0] === "t" ? " on" : ""), "data-v": v[0], text: v[1], onclick: function () { setView(v[0]); } })); });
    $("#hd").appendChild(mv); $("#main").setAttribute("data-v", "t");
    setupSplit(); paint(); paintClock(); paintTm(); login();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script></body></html>
