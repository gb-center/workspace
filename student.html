<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trang học viên | gblearning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{sky:{50:"rgb(var(--sky-50) / <alpha-value>)",100:"rgb(var(--sky-100) / <alpha-value>)",200:"rgb(var(--sky-200) / <alpha-value>)",300:"rgb(var(--sky-300) / <alpha-value>)",400:"rgb(var(--sky-400) / <alpha-value>)",500:"rgb(var(--sky-500) / <alpha-value>)",600:"rgb(var(--sky-600) / <alpha-value>)",700:"rgb(var(--sky-700) / <alpha-value>)",800:"rgb(var(--sky-800) / <alpha-value>)",900:"rgb(var(--sky-900) / <alpha-value>)"}}}}}</script>
  <script src="https://unpkg.com/lucide@0.462.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lms.css">
  <script>window.LMS_THEME_KEY = 'lms_theme_student_v1';</script>
  <script src="lms.js"></script>
  <style>
    body{padding:0!important}
    #theme-pop .tp-logout{display:none}
    .wrap{max-width:none;margin:0 auto;padding:16px 28px calc(32px + env(safe-area-inset-bottom))}
    @media(max-width:640px){.wrap{padding-left:14px;padding-right:14px}}
    .home-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
    .home-side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
    .home-main{display:flex;flex-direction:column;gap:16px;min-width:0}
    @media(max-width:900px){.home-grid{grid-template-columns:1fr}.home-side{position:static}}
    .home-side .g-info{flex:1}
    @media(min-width:1500px){
      .home-grid{grid-template-columns:340px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"side sched mat" "side prog prog" "side hist asg";align-items:stretch}
      .home-side{grid-area:side;position:static}
      .home-main{display:contents}
      .g-sched{grid-area:sched}.g-mat{grid-area:mat}.g-prog{grid-area:prog}.g-hist{grid-area:hist}.g-asg{grid-area:asg}
    }
    .row-tags{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}    .narrow{max-width:820px;margin:0 auto}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:12px;border-radius:14px;background:#fff;border:1px solid var(--t-border)}
    .stat b{display:block;font-size:1.375rem;font-weight:800;color:var(--t-ink);line-height:1.2}
    .stat span{font-size:.75rem;color:var(--t-muted)}
    .hrow{display:grid;grid-template-columns:5.25rem 3.25rem 6.5rem 4rem 1fr;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--t-border)}
    .hrow .tag{display:block;text-align:center}
    @media(max-width:600px){.hrow{grid-template-columns:5rem 3rem 1fr}.hrow .h-note{grid-column:1/-1}}
    .card{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);border-radius:1.5rem;padding:18px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
    .card.hero-card{background:linear-gradient(135deg,var(--t-primary) 0%,var(--t-primary-2) 100%);border-color:transparent;color:#fff}
    .card h2{display:flex;align-items:center;gap:10px;font-size:.9375rem;font-weight:800;color:var(--t-ink);margin-bottom:12px}
    .card h2 svg{box-sizing:border-box;width:32px;height:32px;padding:8px;border-radius:50%;background:var(--t-tint);color:var(--t-primary);flex:none}
    .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--t-border)}
    .c-day{display:inline-block;width:5.25rem;font-weight:700}
    .c-date{display:inline-block;width:3.25rem;font-weight:700}
    .hrow .c-day,.hrow .c-date{width:auto}
    .c-time{display:inline-block;width:8rem;white-space:nowrap}
    details.card > summary{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;list-style:none}
    details.card > summary::-webkit-details-marker{display:none}
    details.card > summary h2{margin:0;flex:1}
    details.card > summary .chev{width:20px;height:20px;flex:none;transition:transform .15s}
    details.card[open] > summary .chev{transform:rotate(180deg)}
    details.card[open] > summary{margin-bottom:8px}
    .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:9999px}
    .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--t-line);background:#fff;color:var(--t-ink);font-size:.9375rem}
    .opt[aria-pressed="true"]{border-color:var(--t-primary);background:var(--t-tint);font-weight:700}
    .opt.good{border-color:#059669;background:#ecfdf5}
    .opt.bad{border-color:#e11d48;background:#fff1f2}
    .qbox{padding:14px 0;border-bottom:1px solid var(--t-border)}
    .qbox:last-child{border-bottom:0}
    .btn-primary[disabled]{opacity:.55}
    .hidden{display:none!important}
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="wrap" style="padding-top:10px;padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div class="flex items-center gap-3" style="min-width:0">
        <div class="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white" style="flex:none"><i data-lucide="graduation-cap" class="w-4 h-4"></i></div>
        <div style="min-width:0"><div class="text-base font-bold text-slate-900" id="hello" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">gblearning</div><div class="text-xs text-slate-500" id="hello-sub"></div></div>
      </div>
      <div class="header-tools flex items-center gap-2">
        <a id="btn-class" class="icon-btn hidden" href="#" aria-label="Về trang lớp (chỉ giáo viên)" title="Về trang lớp"><i data-lucide="school" class="w-5 h-5"></i></a>
        <a id="btn-back" class="btn-soft hidden" href="#"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>Quay lại</span></a>
        <button id="btn-theme" type="button" aria-label="Tùy chỉnh màu chủ đề" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="palette" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <main class="wrap space-y-4" id="app"><div class="card text-center text-sm text-slate-500">Đang tải...</div></main>

  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id), esc = LMS.esc, icons = () => { if (window.lucide) lucide.createIcons(); };
    const DAY = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const STATUS = { planned: ['Sắp tới', 'bg-slate-100 text-slate-600'], done: ['Đã học', 'bg-emerald-50 text-emerald-700'], cancel: ['Hủy', 'bg-rose-50 text-rose-700'],
      makeup: ['Học bù', 'bg-sky-50 text-sky-700'], holiday: ['Nghỉ lễ', 'bg-slate-100 text-slate-600'] };
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const dOf = k => new Date(k + 'T00:00:00');
    const dayCols = k => { const d = dOf(k); return '<strong class="c-day">' + DAY[d.getDay()] + '</strong><strong class="c-date">' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '</strong>'; };
    const fmtDay = k => { const d = dOf(k); return DAY[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
    const PAGES = 'https://gb-center.github.io/workspace/';
    const isHttp = u => /^https?:\/\//i.test(u || '');
    function progressCard(asg) {
      const byWeek = {};
      asg.forEach(a => {
        if (a.first_score == null || !a.week_start) return;
        const tot = a.first_total || a.question_count; if (!tot) return;
        (byWeek[a.week_start] = byWeek[a.week_start] || []).push(100 * a.first_score / tot);
      });
      const pts = Object.keys(byWeek).sort().slice(-8).map(k => ({ k, v: Math.round(byWeek[k].reduce((x, y) => x + y, 0) / byWeek[k].length) }));
      const head = '<section class="card g-prog"><h2><i data-lucide="trending-up"></i>Tiến độ điểm</h2>';
      if (!pts.length) return head + '<div class="text-sm text-slate-500">Chưa có điểm. Làm bài tập online để theo dõi tiến độ.</div></section>';
      const W = 320, H = 170, L = 32, R = 16, T = 18, B = 30, iw = W - L - R, ih = H - T - B;
      const X = i => L + (pts.length === 1 ? iw / 2 : iw * i / (pts.length - 1)), Y = v => T + ih * (1 - v / 100);
      const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--t-border)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--t-muted)">${v}</text>`).join('');
      const line = pts.length > 1 ? `<polyline fill="none" stroke="var(--t-primary)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((q, i) => X(i) + ',' + Y(q.v)).join(' ')}"/>` : '';
      const dots = pts.map((q, i) => {
        const last = i === pts.length - 1, d = dOf(q.k);
        return `<circle cx="${X(i)}" cy="${Y(q.v)}" r="${last ? 5.5 : 4}" fill="${last ? 'var(--t-primary)' : '#fff'}" stroke="var(--t-primary)" stroke-width="2"/>` +
          (pts.length <= 6 || last ? `<text x="${X(i)}" y="${Y(q.v) - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--t-ink)">${q.v}%</text>` : '') +
          `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--t-muted)">${pad(d.getDate())}/${pad(d.getMonth() + 1)}</text>`;
      }).join('');
      const avg = Math.round(pts.reduce((x, q) => x + q.v, 0) / pts.length);
      return head + `<div class="text-xs text-slate-500 mb-2">Điểm lần làm đầu tiên, trung bình theo tuần (%) · Trung bình ${avg}% · Gần nhất ${pts[pts.length - 1].v}%</div>
        <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ điểm theo tuần" style="display:block;max-width:560px">${grid}${line}${dots}</svg></section>`;
    }
    const S = { c: null, code: '', data: null, a: null, answers: {}, t0: 0, busy: false };

    function mondayKey(d) { const dow = d.getDay() === 0 ? 6 : d.getDay() - 1; return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow)); }
    function errText(e) {
      const m = (e && e.message) || '';
      if (/student_not_found/.test(m)) return 'Mã học viên chưa đúng hoặc đã bị tạm ngưng. Hỏi lại giáo viên để lấy link mới.';
      if (/assignment_not_found/.test(m)) return 'Bài này hiện không mở.';
      return LMS.friendlyError(e);
    }
    function showError(msg) { $('app').innerHTML = `<div class="narrow"><div class="card text-center"><p class="text-sm text-rose-700">${esc(msg)}</p></div></div>`; $('hello').textContent = 'gblearning'; $('hello-sub').textContent = ''; }

    /* ---------- Trang chính ---------- */
    function linksBlock(items, label, icon) {
      const list = (items || []).filter(x => x && (x.url || x.title));
      if (!list.length) return '';
      return list.map((x, i) => isHttp(x.url)
        ? `<a class="row" href="${esc(LMS.withStudent(x.url, S.code))}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--t-primary);font-weight:700;min-height:48px"><i data-lucide="${icon}" class="w-4 h-4"></i><span style="overflow-wrap:anywhere">${esc(x.title || label + ' ' + (i + 1))}</span><i data-lucide="arrow-up-right" class="w-4 h-4" style="margin-left:auto"></i></a>`
        : `<div class="row"><span>${esc(x.title || label + ' ' + (i + 1))}</span></div>`).join('');
    }

    const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
    const hm = n => { n = Math.max(0, n); return pad(Math.floor(n / 60)) + ':' + pad(n % 60); };
    function renderHome() {
      const d = S.data, cls = d.class, now = new Date(), todayKey = ymd(now), nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
      $('hello').textContent = 'Xin chào, ' + d.student_name; $('hello-sub').textContent = cls ? 'Lớp ' + cls.name : 'Chưa xếp lớp';
      $('btn-back').classList.add('hidden');
      if (!cls) { $('app').innerHTML = '<div class="card text-sm text-slate-600">Bạn chưa được xếp lớp. Hỏi giáo viên nhé.</div>'; return; }
      const sess = d.sessions || [];
      const joinOpen = s => s.mode === 'online' && isHttp(d.meet_url) && s.status !== 'cancel' && s.status !== 'holiday' && s.date === todayKey
        && nowHM >= hm(toMin(s.start) - 15) && nowHM < s.end;
      const joinBtn = k => k === 'solid'
        ? `<a class="hero-btn solid" href="${esc(d.meet_url)}" target="_blank" rel="noopener"><i data-lucide="video" class="w-4 h-4"></i><span>Vào lớp online</span></a>`
        : `<a class="tag bg-sky-600 text-white" href="${esc(d.meet_url)}" target="_blank" rel="noopener" style="text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:6px;font-weight:700">Vào lớp</a>`;
      const next = sess.find(s => (s.status === 'planned' || s.status === 'makeup') && (s.date > todayKey || (s.date === todayKey && s.end > nowHM)));
      const wk = mondayKey(now), thisWeek = sess.filter(s => mondayKey(dOf(s.date)) === wk);
      const done = sess.filter(s => s.status === 'done' || s.status === 'makeup'), absent = sess.filter(s => s.attendance === 'absent').length;
      const past = sess.filter(s => s.date <= todayKey && s.status !== 'planned').slice().reverse();
      const weeks = (d.week_links || []).filter(w => (w.lessons || []).length || (w.homeworks || []).length).slice().reverse();

      let side = '', html = '';
      side += `<section class="card hero-card" style="color:#fff"><div class="text-xs" style="opacity:.85">Buổi học tiếp theo</div>
        <div class="text-xl font-extrabold mt-1">${next ? fmtDay(next.date) : 'Chưa có lịch'}</div>
        <div class="text-sm mt-1" style="opacity:.9">${next ? next.start + ' - ' + next.end + (next.lesson ? ' · ' + esc(next.lesson) : '') : ''}</div>
        <div class="flex flex-wrap gap-2 mt-4">
          ${next ? (next.mode === 'online' ? (joinOpen(next) ? joinBtn('solid') : `<span class="hero-btn ghost" style="opacity:.9;white-space:nowrap"><i data-lucide="video" class="w-4 h-4"></i><span>Online · mở link trước 15 phút</span></span>`) : `<span class="hero-btn ghost" style="opacity:.9"><i data-lucide="map-pin" class="w-4 h-4"></i><span>Học trực tiếp</span></span>`) : ''}
          <a class="hero-btn ghost" href="${esc(isHttp(cls.drive_url) ? cls.drive_url : 'https://drive.google.com')}" target="_blank" rel="noopener"><i data-lucide="folder" class="w-4 h-4"></i><span>Tài liệu</span></a>
        </div></section>`;

      const asgAll = d.assignments || [], asgDone = asgAll.filter(a => a.attempts).length;
      const sc = asgAll.filter(a => a.first_score != null && (a.first_total || a.question_count)).map(a => 100 * a.first_score / (a.first_total || a.question_count));
      side += `<section class="card g-info"><h2><i data-lucide="user-round"></i>Thông tin học viên</h2>
        <div class="text-sm font-bold text-slate-800" style="overflow-wrap:anywhere">${esc(d.student_name)}</div>
        <div class="text-xs text-slate-500 mb-3">Lớp ${esc(cls.name)}</div>
        <div class="stat-grid">
          <div class="stat"><b>${done.length}</b><span>Buổi đã học</span></div>
          <div class="stat"><b>${absent}</b><span>Buổi vắng</span></div>
          <div class="stat"><b>${asgDone}/${asgAll.length}</b><span>Bài online đã làm</span></div>
          <div class="stat"><b>${sc.length ? Math.round(sc.reduce((x, y) => x + y, 0) / sc.length) + '%' : '–'}</b><span>Điểm lần đầu (TB)</span></div>
        </div></section>`;

      html += `<section class="card g-sched"><h2><i data-lucide="calendar-days"></i>Lịch học tuần này</h2><div class="space-y-2">${thisWeek.length ? thisWeek.map(s => {
        const st = STATUS[s.status] || STATUS.planned;
        return `<div class="row">${dayCols(s.date)}<span class="c-time font-semibold text-sky-700">${s.start} - ${s.end}</span><span class="row-tags"><span class="tag ${st[1]}">${st[0]}</span>${s.attendance === 'absent' ? '<span class="tag bg-rose-50 text-rose-700">Vắng</span>' : ''}${s.mode === 'online' ? (joinOpen(s) ? joinBtn('row') : '<span class="tag bg-sky-50 text-sky-700">Online</span>') : ''}</span>${s.lesson ? `<span class="text-xs text-slate-500" style="flex:1 1 100%">${esc(s.lesson)}</span>` : ''}</div>`;
      }).join('') : '<div class="text-sm text-slate-500">Tuần này không có buổi học.</div>'}</div></section>`;

      const asg = d.assignments || [];
      html += `<section class="card g-asg"><h2><i data-lucide="pencil-line"></i>Bài tập online</h2><div class="space-y-2">${asg.length ? asg.map(a => {
        const due = a.due_at ? new Date(a.due_at) : null, late = due && due < now;
        const state = a.parts_total ? (a.parts_done ? `Đã nộp ${a.parts_done}/${a.parts_total} phần${a.first_score != null ? ' · Điểm lần đầu: ' + a.first_score + '/' + (a.first_total || a.question_count) : ''}` : 'Chưa làm') : (a.attempts ? `Đã làm ${a.attempts} lần${a.first_score != null ? ' · Điểm lần đầu: ' + a.first_score + '/' + (a.first_total || a.question_count) : ''}` : 'Chưa làm');
        return `<div class="row"><div style="flex:1 1 200px;min-width:0"><div class="font-bold text-slate-800" style="overflow-wrap:anywhere">${esc(a.name)}</div>
          <div class="text-xs text-slate-500">${a.question_count ? a.question_count + ' câu · ' : ''}${state}${due ? ' · Hạn ' + pad(due.getDate()) + '/' + pad(due.getMonth() + 1) + (late ? ' (đã quá hạn)' : '') : ''}</div></div>
          ${a.page_path ? `<a class="btn-primary" href="${esc(PAGES + a.page_path)}" data-code="${esc(S.code)}" style="text-decoration:none">${a.parts_total ? (a.parts_done >= a.parts_total ? 'Xem lại' : (a.parts_done ? 'Làm tiếp' : 'Làm bài')) : (a.attempts ? 'Làm lại' : 'Làm bài')}</a>` : '<span class="text-xs text-slate-400">Chưa có link</span>'}</div>`;
      }).join('') : '<div class="text-sm text-slate-500">Chưa có bài tập online.</div>'}</div></section>`;

      html += progressCard(asg);

      html += `<section class="card g-mat"><h2><i data-lucide="book-open"></i>Học liệu theo tuần</h2><div class="space-y-3">${weeks.length ? weeks.map((w, i) => {
        const s = dOf(w.week_start), e = new Date(s); e.setDate(s.getDate() + 6);
        return `<details ${i === 0 ? 'open' : ''}><summary class="font-bold text-sm" style="min-height:44px;display:flex;align-items:center;cursor:pointer">Tuần ${pad(s.getDate())}/${pad(s.getMonth() + 1)} – ${pad(e.getDate())}/${pad(e.getMonth() + 1)}</summary>
          <div class="space-y-2 mt-1">${linksBlock(w.lessons, 'Bài học', 'presentation')}${linksBlock(w.homeworks, 'Bài tập', 'file-check-2')}</div></details>`;
      }).join('') : '<div class="text-sm text-slate-500">Chưa có học liệu.</div>'}</div></section>`;

      html += `<details class="card g-hist" open><summary><h2><i data-lucide="history"></i>Lịch sử buổi học</h2><i data-lucide="chevron-down" class="chev"></i></summary>
        <div class="text-xs text-slate-500 mb-2">Đã học ${done.length} buổi · Vắng ${absent} buổi</div>
        <div class="space-y-2">${past.slice(0, 12).map(s => { const st = STATUS[s.status] || STATUS.planned;
          return `<div class="hrow">${dayCols(s.date)}<span class="tag ${st[1]}">${st[0]}</span>${s.attendance === 'absent' ? '<span class="tag bg-rose-50 text-rose-700">Vắng</span>' : '<span></span>'}<span class="h-note text-xs text-slate-500" style="overflow-wrap:anywhere">${s.lesson ? esc(s.lesson) : ''}</span></div>`; }).join('') || '<div class="text-sm text-slate-500">Chưa có buổi học nào.</div>'}</div></details>`;

      $('app').innerHTML = `<div class="home-grid"><aside class="home-side">${side}</aside><div class="home-main">${html}</div></div>`; icons();
      (LMS.isTeacherNow ? LMS.isTeacherNow() : Promise.resolve(false)).then(ok => { const b = $('btn-class'); if (ok && b && S.data === d) { b.href = 'class.html?class=' + encodeURIComponent(cls.code); b.classList.remove('hidden'); } });
    }

    /* ---------- Điều hướng bằng # ---------- */
    async function route() {
      const parts = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent);
      S.code = (parts[0] || '').trim();
      if (!S.code) return showError('Thiếu mã học viên. Mở lại link giáo viên đã gửi.');
      try {
        {
          $('app').innerHTML = '<div class="card text-center text-sm text-slate-500">Đang tải...</div>';
          const r = await S.c.rpc('student_portal', { p_student_code: S.code });
          if (r.error) throw r.error; S.data = r.data; renderHome();
        }
      } catch (e) { showError(errText(e)); }
      window.scrollTo(0, 0);
    }

    function bind() {
      $('app').addEventListener('click', e => { const l = e.target.closest('a[data-code]'); if (l) { try { localStorage.setItem('sc', l.dataset.code); } catch (x) { } } });
      window.addEventListener('hashchange', route);
      const sig = () => { const d = S.data; if (!d) return ''; const n = new Date(), k = ymd(n), h = pad(n.getHours()) + ':' + pad(n.getMinutes());
        return (d.sessions || []).map(s => s.mode === 'online' && s.date === k && h >= hm(toMin(s.start) - 15) && h < s.end ? 1 : 0).join(''); };
      let last = null;
      setInterval(() => { if (!S.data || $('btn-back').classList.contains('hidden') === false) return; const g = sig(); if (last === null) { last = g; return; } if (g !== last) { last = g; renderHome(); } }, 30000);
    }

    function boot() {
      icons(); bind(); S.c = LMS.client();
      if (!S.c) return showError('Không tải được thư viện kết nối. Kiểm tra mạng rồi tải lại trang.');
      route();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
  </script>
</body>
</html>
