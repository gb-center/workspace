    body{padding:0!important}
    #theme-pop .tp-logout{display:none}

    .profile-card{display:flex;align-items:center;gap:16px;min-height:126px}
    .profile-avatar{display:flex;align-items:center;justify-content:center;width:60px;height:60px;flex:none;border-radius:20px;background:linear-gradient(145deg,var(--t-tint),#fff);border:1px solid var(--t-border);color:var(--t-primary)}

    .profile-code{display:block;color:var(--t-muted);font-variant-numeric:tabular-nums}

    .materials-week-nav{display:flex;align-items:center;justify-content:center;gap:8px}

    .g-mat,.g-asg{align-self:stretch}
    .g-hero{display:flex;flex-direction:column;justify-content:space-between;gap:12px}
    .hero-lab{display:flex;align-items:center;gap:8px;font-size:.8125rem;opacity:.9}

    .bar{height:10px;border-radius:9999px;background:#dfe5ec;overflow:hidden;margin-top:10px}

    .sk{border-radius:16px;padding:12px 10px;text-align:center;min-height:88px}

    .sk .bar{height:6px;margin-top:8px}

    .sk.c1{background:#efe9fd}.sk.c1 svg{color:#7c3aed}.sk.c1 .bar i{background:#7c3aed}
    .sk.c2{background:#e3f1fd}.sk.c2 svg{color:#2563eb}.sk.c2 .bar i{background:#2563eb}
    .sk.c3{background:#fde8ec}.sk.c3 svg{color:#e11d48}.sk.c3 .bar i{background:#e11d48}

    .stat svg{width:34px;height:34px;padding:8px;border-radius:10px;flex:none;box-sizing:border-box}
    .stat.s0 svg{background:#e3f1fd;color:#2563eb}.stat.s1 svg{background:#fde8ec;color:#e11d48}.stat.s2 svg{background:#e3f1fd;color:#2563eb}.stat.s3 svg{background:#efe9fd;color:#7c3aed}
    .stat b{display:block;font-size:1.125rem;font-weight:800;color:var(--t-ink);line-height:1.2}
    .stat span{font-size:.75rem;color:var(--t-muted)}
    .student-header-inner{position:relative}
    .student-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:23px;width:auto;max-width:32vw;object-fit:contain}
    .student-greeting{max-width:35vw}
    @media(max-width:640px){.student-logo{height:20px;max-width:24vw}.student-greeting{max-width:33vw}.week-materials-toolbar{gap:4px}.materials-week-nav{gap:3px}.materials-week-nav .icon-btn{width:34px;height:34px}.materials-week-current{min-width:190px}.materials-week-label{font-size:.8125rem}.materials-week-now{min-height:28px;padding:0 10px;font-size:.6875rem}.month-controls{gap:10px}.month-title{min-width:122px;font-size:.8125rem}.month-day{min-height:38px;font-size:.75rem}}

    .student-history-row{grid-template-columns:5rem 3rem minmax(0,1fr) auto}
    .hrow .tag{display:block;text-align:center}
    @media(max-width:600px){.hrow{grid-template-columns:5rem 3rem 1fr auto}.hrow .h-note{grid-column:1/-1}}

    .card.hero-card{background:linear-gradient(135deg,var(--t-primary) 0%,var(--t-primary-2) 100%);border-color:transparent;color:#fff}
    .card h2{display:flex;align-items:center;gap:10px;font-size:.9375rem;font-weight:800;color:var(--t-ink);margin-bottom:12px}
    .card h2 svg{box-sizing:border-box;width:32px;height:32px;padding:8px;border-radius:50%;background:var(--t-tint);color:var(--t-primary);flex:none}
    .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--t-border)}
    .srow{flex-wrap:wrap;gap:6px 8px}.srow .c-day{width:4.5rem}.srow .c-date{width:3rem}.srow .c-time{width:auto}.srow .row-tags{flex-wrap:nowrap}
    .row.live{background:#eff6ff;border-color:#bfdbfe}
    .month-head{display:flex;flex-direction:column;align-items:stretch;gap:3px;margin:0 0 8px}
    .month-caption{align-self:center;text-align:center;color:var(--t-muted);font-size:1.125rem;font-weight:800;line-height:1.2}
    .month-controls{display:flex;align-items:center;justify-content:center;gap:14px}
    .month-controls .month-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--t-muted);cursor:pointer}
    .month-controls .month-nav:hover{background:var(--t-soft);color:var(--t-primary)}
    .month-title{min-width:130px;text-align:center;font-size:.875rem;font-weight:800;color:var(--t-primary);white-space:nowrap}
    .month-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
    .student-main .g-sched .month-calendar{width:100%;max-width:1120px;margin-inline:auto;column-gap:10px;row-gap:8px}
    .student-main .g-sched .month-weekday{padding:7px 0;font-size:.8125rem}
    .student-main .g-sched .month-day{width:min(64px,100%);font-size:1rem}
    .student-main .g-sched .month-day.has-session,.student-main .g-sched .month-day.today,.student-main .g-sched .month-day.selected{width:min(64px,100%)}
    .month-weekday{text-align:center;padding:4px 0;color:var(--t-muted);font-size:.6875rem;font-weight:700}
    .month-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:min(52px,100%);aspect-ratio:1/1;min-width:0;min-height:0;justify-self:center;padding:3px 2px;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--t-ink);font-size:.8125rem;font-weight:600;cursor:pointer}
    .month-day:hover{background:var(--t-soft)}
    .month-day.outside{color:#aeb8ca;cursor:default}
    .month-day.has-session{width:min(52px,100%);aspect-ratio:1/1;min-height:0;justify-self:center;border-radius:50%;border-color:var(--t-tint-2);background:var(--t-tint);color:var(--t-primary);font-weight:800}
    .month-day.today{width:min(52px,100%);aspect-ratio:1/1;min-height:0;justify-self:center;border-radius:50%;box-shadow:inset 0 0 0 1px var(--t-accent)}
    .month-day.selected{width:min(52px,100%);aspect-ratio:1/1;min-height:0;justify-self:center;border-radius:50%;background:var(--t-primary);border-color:var(--t-primary);color:#fff}
    .month-day-count{font-size:.5625rem;line-height:1;color:var(--t-accent);font-weight:800}
    .month-day.selected .month-day-count{color:#fff}
    .week-calendar-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
    .week-calendar-title{font-size:.8125rem;font-weight:800;color:var(--t-primary)}
    .week-calendar-range{font-size:.625rem;color:var(--t-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .week-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
    .week-calendar-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:min(52px,100%);height:auto;aspect-ratio:1/1;box-sizing:border-box;min-width:0;min-height:0;justify-self:center;padding:2px;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--t-ink);cursor:pointer;line-height:1.1}
    .week-calendar-day:hover:not(.selected):not(.has-session){background:var(--t-soft)}
    .week-calendar-day span{font-size:.5625rem;font-weight:700;color:var(--t-muted);line-height:1}
    .week-calendar-day b{font-size:.75rem;font-weight:600;line-height:1.1}
    .week-calendar-day.has-session{border-color:var(--t-tint-2);background:var(--t-tint);color:var(--t-primary)}
    .week-calendar-day.has-session b{font-weight:800}
    .week-calendar-day.today{box-shadow:inset 0 0 0 1px var(--t-accent)}
    .week-calendar-day.selected{background:var(--t-primary);border-color:var(--t-primary);color:#fff}
    .week-calendar-day.selected span{color:rgba(255,255,255,.76)}
    .week-calendar-day.selected.today{box-shadow:inset 0 0 0 1px var(--t-accent)}
    .month-detail{min-height:46px;margin-top:12px;padding-top:10px;border-top:1px solid var(--t-border)}

    .month-session-top{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
    .month-session-top strong{white-space:nowrap}

    .month-session-meta{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:0 0 auto;flex-wrap:nowrap}

    .c-day{display:inline-block;width:5.25rem;font-weight:700}
    .c-date{display:inline-block;width:3.25rem;font-weight:700}
    .hrow .c-day,.hrow .c-date{width:auto}
    .c-time{display:inline-block;width:8rem;white-space:nowrap}
    details.card > summary{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;list-style:none}
    details.card > summary::-webkit-details-marker{display:none}
    details.card > summary h2{margin:0;flex:1}

    details.card[open] > summary .chev{transform:rotate(180deg)}
    details.card[open] > summary{margin-bottom:8px}
    .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:9999px}
    .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--t-line);background:#fff;color:var(--t-ink);font-size:.9375rem}
    .opt[aria-pressed="true"]{border-color:var(--t-primary);background:var(--t-tint);font-weight:700}

    /* Student portal: clean three-panel learning workspace */
    body.student-dashboard-view{--t-primary:#0b1f44;--t-primary-2:#18345f;--t-accent:#2563eb;--t-tint:#eef2f7;--t-tint-2:#d5deea;--t-soft:#f5f7fa;--t-border:#dfe4eb;--t-line:#c5ceda;--t-muted:#596579;--t-ink:#172235;--page-bg:transparent;background:transparent!important;color:#172235}

    .student-header-inner>.student-greeting{display:none}

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="wrap student-header-inner" style="padding-top:10px;padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div class="student-greeting" style="min-width:0"><div class="text-base font-bold text-slate-900" id="hello" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">gblearning</div><div class="text-xs text-slate-500" id="hello-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div></div>
      <img class="student-logo" src="logo-wordmark.png" alt="gblearninghub">
      <div class="header-tools flex items-center gap-2">
        <a id="btn-home" class="icon-btn hidden" href="index.html" aria-label="Trang chính" title="Trang chính"><i data-lucide="house" class="w-5 h-5"></i></a>
        <a id="btn-class" class="icon-btn hidden" href="#" aria-label="Về trang lớp (chỉ giáo viên)" title="Về trang lớp"><i data-lucide="school" class="w-5 h-5"></i></a>
        <a id="btn-back" class="btn-soft hidden" href="#"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>Quay lại</span></a>
        <button id="btn-theme" type="button" aria-label="Tùy chỉnh màu chủ đề" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="palette" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <main class="wrap space-y-4" id="app"><div class="card text-center text-sm text-slate-500">Đang tải...</div></main>

  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id), esc = LMS.esc, icons = () => { if (window.lucide) lucide.createIcons(); };
    const DAY = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const BASE_MONDAY = new Date(2026, 8, 7);
    const tuiTone = st => st === 'Đã đóng' ? 'bg-emerald-50 text-emerald-700' : st === 'Chưa đóng' ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-600';
    const STATUS = { planned: ['Sắp tới', 'bg-slate-100 text-slate-600'], done: ['Đã học', 'bg-emerald-50 text-emerald-700'], cancel: ['Hủy', 'bg-rose-50 text-rose-700'],
      makeup: ['Học bù', 'bg-sky-50 text-sky-700'], holiday: ['Nghỉ lễ', 'bg-slate-100 text-slate-600'] };
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const dOf = k => new Date(k + 'T00:00:00');
    const dayCols = k => { const d = dOf(k); return '<strong class="c-day">' + DAY[d.getDay()] + '</strong><strong class="c-date">' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '</strong>'; };
    const fmtDay = k => { const d = dOf(k); return DAY[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
    const isHttp = u => /^https?:\/\//i.test(u || '');
    const sessState = (s, n) => { const k = ymd(n), h = pad(n.getHours()) + ':' + pad(n.getMinutes()); if (s.date < k || (s.date === k && h >= s.end)) return 'past'; if (s.date === k && h >= s.start) return 'live'; return 'soon'; };
    const S = { c: null, code: '', data: null, a: null, answers: {}, t0: 0, busy: false, materialWeek: '', materialWeeks: [], calendarMonth: '', calendarDate: '', view: 'overview', historyLimit: 10, tuitionHistory: null, tuitionHistoryLoading: false };

    function mondayKey(d) { const dow = d.getDay() === 0 ? 6 : d.getDay() - 1; return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow)); }
    function errText(e) {
      const m = (e && e.message) || '';
      if (/student_not_found/.test(m)) return 'Mã học viên chưa đúng hoặc đã bị tạm ngưng. Hỏi lại giáo viên để lấy link mới.';
      if (/assignment_not_found/.test(m)) return 'Bài này hiện không mở.';
      return LMS.friendlyError(e);
    }
    function restoreHeaderActions() { const tools = document.querySelector('.header-tools'); if (tools) ['btn-home','btn-class','btn-theme'].forEach(id => { const el = $(id); if (el) tools.appendChild(el); }); document.body.classList.remove('student-dashboard-view'); }
    function showError(msg) { restoreHeaderActions(); $('app').innerHTML = `<div class="narrow"><div class="card text-center"><p class="text-sm text-rose-700">${esc(msg)}</p></div></div>`; $('hello').textContent = 'gblearning'; $('hello-sub').textContent = ''; }

    /* ---------- Trang chính ---------- */
    function linksBlock(items, label, icon) {
      const list = (items || []).filter(x => x && (x.url || x.title));
      if (!list.length) return '';
      return list.map((x, i) => isHttp(x.url)
        ? `<a class="row" href="${esc(LMS.withStudent(x.url, S.code))}" style="text-decoration:none;color:var(--t-primary);font-weight:700;min-height:48px"><i data-lucide="${icon}" class="w-4 h-4"></i><span style="overflow-wrap:anywhere">${esc(x.title || label + ' ' + (i + 1))}</span><i data-lucide="arrow-up-right" class="w-4 h-4" style="margin-left:auto"></i></a>`
        : `<div class="row"><span>${esc(x.title || label + ' ' + (i + 1))}</span></div>`).join('');
    }

    const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
    const hm = n => { n = Math.max(0, n); return pad(Math.floor(n / 60)) + ':' + pad(n % 60); };
    function renderHome() {
      const d = S.data, cls = d.class, now = new Date(), todayKey = ymd(now), nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.body.classList.add('student-dashboard-view');
      $('hello').textContent = 'Xin chào, ' + d.student_name; document.title = 'Student Portal - ' + d.student_name; $('hello-sub').textContent = cls ? 'Lớp ' + cls.name : 'Chưa xếp lớp';
      $('btn-back').classList.add('hidden');
      if (!cls) { restoreHeaderActions(); $('app').innerHTML = '<div class="card text-sm text-slate-600">Bạn chưa được xếp lớp. Hỏi giáo viên nhé.</div>'; return; }
      const sess = d.sessions || [];
      const joinOpen = s => s.mode === 'online' && isHttp(d.meet_url) && s.status !== 'cancel' && s.status !== 'holiday' && s.date === todayKey
        && nowHM >= hm(toMin(s.start) - 15) && nowHM < s.end;
      const joinBtn = k => k === 'solid'
        ? `<a class="hero-btn solid" href="${esc(d.meet_url)}" target="_blank" rel="noopener" aria-label="Mở Google Meet"><i data-lucide="video" class="w-4 h-4"></i><span>Meet</span></a>`
        : `<a class="tag bg-sky-600 text-white" href="${esc(d.meet_url)}" target="_blank" rel="noopener" aria-label="Mở Google Meet" style="text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:6px;font-weight:700"><i data-lucide="video" class="w-3.5 h-3.5"></i><span>Meet</span></a>`;
      const next = sess.find(s => (s.status === 'planned' || s.status === 'makeup') && (s.date > todayKey || (s.date === todayKey && s.end > nowHM)));
      if (!S.calendarMonth) S.calendarMonth = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
      if (!S.calendarDate) S.calendarDate = todayKey;
      const done = sess.filter(s => s.status === 'done' || s.status === 'makeup'), absent = sess.filter(s => s.attendance === 'absent').length;
      const past = sess.filter(s => s.date <= todayKey && s.status !== 'planned').slice().reverse();
      const weeks = (d.week_links || []).filter(w => (w.lessons || []).length || (w.homeworks || []).length).slice().reverse();

      const prog = d.program || 'gs', PNAME = { ielts: 'IELTS', toeic: 'TOEIC', ac12: 'AC12', gs: 'Global Success', comm: 'Giao tiếp' };
      const titleCaseName = value => String(value || '').toLocaleLowerCase('vi').replace(/(^|\s)(\p{L})/gu, (_, space, letter) => space + letter.toLocaleUpperCase('vi'));
      const miniProfile = `<div class="m-profile"><span class="m-av" aria-hidden="true"><i data-lucide="user-round"></i></span><span class="m-pi"><b>${esc(titleCaseName(d.student_name))}</b><span><em>${esc(cls.name)}</em><i>${esc(S.code)}</i></span></span></div>`;
      const profileHtml = `<section class="card profile-card g-profile"><div class="profile-avatar" aria-hidden="true"><i data-lucide="user-round"></i></div><div class="profile-info"><h2 class="profile-name" data-student-name="${esc(titleCaseName(d.student_name))}">${esc(d.student_name)}</h2><div class="profile-meta"><span class="profile-class">${esc(cls.name)}</span><span class="profile-code">${esc(S.code)}</span></div></div></section>`;
      const heroHtml = `<section class="card hero-card g-hero" style="color:#fff">
        <div class="hero-lab"><i data-lucide="calendar-days" class="w-4 h-4"></i>Buổi học tiếp theo</div>
        <div class="hero-next-time"><div class="text-xl font-extrabold">${next ? fmtDay(next.date) : 'Chưa có lịch'}</div>
        <div class="text-sm mt-2" style="opacity:.9;display:flex;align-items:center;gap:6px">${next ? '<i data-lucide="clock" class="w-4 h-4"></i>' + next.start + ' – ' + next.end : ''}</div></div>
        <div class="hero-actions">
          ${next ? (next.mode === 'online' ? (joinOpen(next) ? joinBtn('solid') : `<span class="hero-btn ghost" title="Link mở trước 15 phút" style="opacity:.9;white-space:nowrap"><i data-lucide="video" class="w-4 h-4"></i><span>Meet</span></span>`) : `<span class="hero-btn ghost" style="opacity:.9"><i data-lucide="map-pin" class="w-4 h-4"></i><span>Học trực tiếp</span></span>`) : ''}

      const body = T.view === 'rail' ? '' : T.view === 'lessons' ? tWeekList('lesson') : T.view === 'submissions' ? tSubView()
        : `<section class="card t-daybar"><h2><i data-lucide="calendar-days"></i>${fmtDay(T.date)}</h2><span class="tag bg-slate-100 text-slate-600">${list.length} lớp</span></section>${tSlots(list) || '<section class="card text-center text-sm text-slate-500">Không có lớp nào ngày này.</section>'}`;
      const hm = body.match(/^<section class="card t-daybar">[\s\S]*?<\/section>/), head = hm ? hm[0] : '', rest = body.slice(head.length);
      const railBase = `<section class="card"><h2><i data-lucide="bar-chart-3"></i>Tổng kết tuần</h2><div class="t-stats"><div class="t-stat c-all"><b>${T.sess.length}</b><span>Buổi</span></div><div class="t-stat c-done"><b>${done}</b><span>Đã dạy</span></div><div class="t-stat c-left"><b>${left}</b><span>Sắp tới</span></div></div></section>
        <section class="card"><div class="week-calendar-head"><span class="week-calendar-title"><i data-lucide="calendar-days"></i>Thời khóa biểu tuần ${wk}</span><span class="week-calendar-range">${range}</span></div><div class="week-calendar" role="grid" aria-label="Chọn ngày">${cal}</div><div class="t-tt">${tt}</div></section>
        `;
      const rail = railBase + (T.pick && slots.find(g => g.key === T.pick) ? tPickCard(slots.find(g => g.key === T.pick).all) : tNextCard());
      $('app').innerHTML = `<div class="student-shell student-shell-inner-tabs"><div class="student-welcome"><div class="student-welcome-left"><a class="logo-home" href="index.html#overview"  aria-label="Về trang tổng quan"><img class="student-welcome-logo" src="logo-wordmark-gold-navy.png" alt="gblearninghub"></a><span class="student-welcome-brand-divider" aria-hidden="true"></span></div><div class="student-welcome-title"><h1>${titles[T.view]}</h1><p>Khu vực giảng dạy</p></div><div class="student-welcome-right"><div class="student-welcome-actions">${wkCtl}</div><div class="student-welcome-tools"></div></div></div>
        <aside class="student-sidebar" aria-label="Điều hướng giáo viên"><div class="student-brand"><a class="logo-home" href="index.html#overview"  aria-label="Về trang tổng quan"><img src="logo-wordmark-gold-navy.png" alt="gblearninghub"></a></div><nav class="student-nav">${nav('rail', 'Tổng quan', 'layout-dashboard', 'm-only')}${nav('day', 'Lịch dạy', 'calendar-days')}${nav('lessons', 'Bài học', 'presentation')}${nav('submissions', 'Bài nộp', 'inbox')}</nav></aside>
        <div class="student-workspace"><section class="student-main" aria-label="Nội dung giảng dạy"><div class="t-stick">${head}<div class="m-week">${wkCtl}</div></div><div class="student-main-content t-content">${T.view === 'rail' ? `<div class="t-rail t-rail-m">${railBase}</div>` : rest}</div></section><aside class="student-rail t-rail" aria-label="Tổng kết và lịch tuần">${rail}</aside></div></div>`;
      const tools = document.querySelector('.student-welcome-tools');
      if (tools) ['btn-home', 'btn-theme'].forEach(id => { const el = $(id); if (el) tools.appendChild(el); });
      icons(); window.scrollTo(0, y);
    }
    async function renderTeacher(dateArg) {
      const redraw = !!$('app').querySelector('.t-content'); T.on = true; if (!redraw) restoreHeaderActions();
      $('hello').textContent = 'Giáo viên'; $('hello-sub').textContent = 'Khu vực giảng dạy'; document.title = 'Giáo viên | gblearning';
      ['btn-class', 'btn-back'].forEach(id => $(id).classList.add('hidden')); $('btn-home').classList.remove('hidden');
      if (!$('app').querySelector('.t-content')) $('app').innerHTML = '<div class="card text-center text-sm text-slate-500">Đang tải...</div>';
      try {
        if (!T.authed) { await LMS.requireTeacher(); T.authed = true; }
        T.date = /^\d{4}-\d{2}-\d{2}$/.test(dateArg || '') ? dateArg : ymd(new Date());
        await Promise.all([loadTeacherWeek(mondayKey(dOf(T.date))), Date.now() - T.nextAt < 60000 ? null : loadNext()]);
        if (T.view === 'submissions') await loadSubs();
        bindTeacher(); drawTeacher(); prefetchWeeks(T.monday);
      } catch (e) { showError(errText(e)); }
    }
    async function tRefresh() { await Promise.all([loadTeacherWeek(T.monday, true), loadNext()]); if (T.view === 'submissions') await loadSubs(); drawTeacher(); }
    function tToggle(sid) {
      const card = $('app').querySelector('.t-row[data-sid="' + sid + '"]'); if (!card) return;
      const body = card.querySelector('.t-body'), btn = card.querySelector('.t-row-head'), open = body.hidden;
      body.hidden = !open; btn.setAttribute('aria-expanded', String(open)); open ? T.open.add(Number(sid)) : T.open.delete(Number(sid));
    }
    function bindTeacher() {
      if (T.bound) return; T.bound = true;
      const app = $('app');
      app.addEventListener('click', async e => {
        if (!T.on) return;
        const sx = e.target.closest('.t-sub-head, .t-bar');
        if (sx) { const c = sx.closest('.t-sub'), body = c.querySelector('.t-sub-body'), open = body.hidden, k = c.dataset.aid; body.hidden = !open; c.querySelector('.t-sub-head').setAttribute('aria-expanded', String(open)); open ? T.subOpen.add(k) : T.subOpen.delete(k); return; }
        const dh = e.target.closest('.t-dayc-head');
        if (dh) { const c = dh.closest('.t-dayc'), body = c.querySelector('.t-dayc-body'), open = body.hidden; body.hidden = !open; dh.setAttribute('aria-expanded', String(open)); open ? (T.dayClosed.delete(c.dataset.dkey), T.dayOpenM.add(c.dataset.dkey)) : (T.dayClosed.add(c.dataset.dkey), T.dayOpenM.delete(c.dataset.dkey)); return; }
        const sh = e.target.closest('.t-slot-head');
        if (sh && !e.target.closest('select, a, input, textarea, button')) { const rows = [...sh.closest('.t-slot').querySelectorAll('.t-row')], anyOpen = rows.some(r => !r.querySelector('.t-body').hidden); rows.forEach(r => { const open = !r.querySelector('.t-body').hidden; if (open === anyOpen) tToggle(r.dataset.sid); }); return; }
        const head = e.target.closest('.t-row-head');
        if (head && !e.target.closest('select, a, input, textarea, [data-t]:not([data-t="toggle"])')) { tToggle(head.closest('.t-row').dataset.sid); return; }
        const b = e.target.closest('[data-t]'); if (!b || b.tagName === 'FORM' || b.tagName === 'INPUT') return;
        const k = b.dataset.t;
        try {
          if (k === 'toggle') tToggle(b.dataset.sid);
          else if (k === 'pick') { if (matchMedia('(max-width:780px)').matches) tPickModal(b.dataset.key); else { T.pick = T.pick === b.dataset.key ? null : b.dataset.key; drawTeacher(); } }
          else if (k === 'pick-clear') { T.pick = null; drawTeacher(); }
          else if (k === 'pick-open') { T.view = 'day'; T.slotOpen.add(b.dataset.key); T.sess.filter(x => x.session_date === T.date && hhmm(x.start_time) + ' – ' + hhmm(x.end_time) === b.dataset.key).forEach(x => T.open.add(x.id)); drawTeacher(); window.scrollTo(0, 0); }
          else if (k === 'roster') tRoster(Number(b.dataset.cid), Number(b.dataset.sid));
          else if (k === 'view') { T.view = b.dataset.view; if (T.view === 'submissions') { drawTeacher(); await loadSubs(); } drawTeacher(); window.scrollTo(0, 0); }
          else if (k === 'sub-refresh') { await loadSubs(); drawTeacher(); LMS.toast('Đã tải lại bài nộp'); }
          else if (k === 'day') { const d = b.dataset.date; if (T.view !== 'rail') T.view = 'day'; if (mondayKey(dOf(d)) === T.monday) { T.date = d; history.replaceState(null, '', '#teacher/' + d); drawTeacher(); } else location.hash = '#teacher/' + d; }
          else if (k === 'wk') { location.hash = '#teacher/' + addDays(T.date, Number(b.dataset.step)); }
          else if (k === 'today') { location.hash = '#teacher/' + ymd(new Date()); }
          else if (k === 'sess-save') {
            for (const row of b.closest('.t-slot').querySelectorAll('.t-row')) {
              const id = Number(row.dataset.sid), patch = { note: row.querySelector('[data-f="note"]').value.trim() || null };
              const r = await S.c.from('sessions').update(patch).eq('id', id); if (r.error) throw r.error;
              const x = T.sess.find(y => y.id === id); if (x) Object.assign(x, patch);
            }
            LMS.toast('Đã lưu buổi học');
          }
          else if (k === 'mat-edit') {
            const m = T.mats.find(x => x.id === Number(b.dataset.id)); if (!m) return;
            const q = b.closest('.t-grid > div').querySelector('.t-form').elements;
            q.id.value = m.id; q.title.value = m.title; q.url.value = m.url; q.title.focus();
          }
          else if (k === 'mat-del') {
            const m = T.mats.find(x => x.id === Number(b.dataset.id)), cid = Number(b.dataset.cid); if (!m) return;
            if (!await LMS.confirm('Xóa "' + m.title + '" khỏi lớp này?')) return;
            const rest = (m.class_ids || []).filter(x => x !== cid);
            const r = rest.length ? await S.c.from('week_materials').update({ class_ids: rest }).eq('id', m.id) : await S.c.from('week_materials').delete().eq('id', m.id);
            if (r.error) throw r.error; await tRefresh();
          }
        } catch (err) { LMS.alert(errText(err)); }
      });
      app.addEventListener('change', async e => {
        const sel = T.on && e.target.closest('select[data-f="status"]'); if (!sel) return;
        try {
          if (!sel.value) return;
          const ids = sel.dataset.sids.split(',').map(Number), r = await S.c.from('sessions').update({ status: sel.value }).in('id', ids); if (r.error) throw r.error;
          T.sess.forEach(x => { if (ids.includes(x.id)) x.status = sel.value; });
          LMS.toast('Đã cập nhật trạng thái'); await loadNext(); drawTeacher();
        } catch (err) { LMS.alert(errText(err)); }
      });
      app.addEventListener('submit', async e => {
        const f = e.target.closest('[data-t="mat-form"]'); if (!T.on || !f) return; e.preventDefault();
        try {
          const q = f.elements, id = q.id.value ? Number(q.id.value) : null, title = q.title.value.trim(), url = q.url.value.trim(); if (!title || !url) return;
          let r;
          if (id) r = await S.c.from('week_materials').update({ title, url }).eq('id', id);
          else r = await S.c.from('week_materials').insert({ week_start: T.monday, kind: f.dataset.kind, title, url, class_ids: [Number(f.dataset.cid)], sort_order: T.mats.reduce((n, m) => Math.max(n, m.sort_order || 0), 0) + 1 });
          if (r.error) throw r.error; await tRefresh();
        } catch (err) { LMS.alert(errText(err)); }
      });
    }

    async function route() {
      const parts = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent);
      const nextCode = (parts[0] || '').trim();
      T.on = false;
      if (nextCode === 'teacher' || nextCode === '0000') { S.code = ''; S.data = null; return renderTeacher(parts[1]); }
      if (S.code && nextCode && S.code !== nextCode) { S.data = null; S.view = 'overview'; S.historyLimit = 10; S.tuitionHistory = null; S.tuitionHistoryLoading = false; S.materialWeek = ''; S.materialWeeks = []; S.calendarMonth = ''; S.calendarDate = ''; }
      S.code = nextCode;
      if (!S.code) return showError('Thiếu mã học viên. Mở lại link giáo viên đã gửi.');
      try {
        if (parts[1]) {
          $('app').innerHTML = '<div class="card text-center text-sm text-slate-500">Đang tải bài...</div>';
          const r = await S.c.rpc('student_assignment', { p_student_code: S.code, p_assignment_code: parts[1] });
          if (r.error) throw r.error; S.a = r.data; renderAssignment();
        } else {
          $('app').innerHTML = '<div class="card text-center text-sm text-slate-500">Đang tải...</div>';
          const r = await S.c.rpc('student_portal', { p_student_code: S.code });
          if (r.error) throw r.error; S.data = r.data; renderHome();
        }
      } catch (e) { showError(errText(e)); }
      window.scrollTo(0, 0);
    }

    function bind() {
      $('app').addEventListener('click', e => {
        if (e.target.closest('[data-student-home]')) { e.preventDefault(); if (S.view !== 'overview') { S.view = 'overview'; renderHome(); } window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        const nav = e.target.closest('[data-student-view]');
        if (nav) { if (nav.dataset.studentView !== S.view) { S.view = nav.dataset.studentView; renderHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
        if (e.target.closest('[data-history-more]')) { S.historyLimit += 10; renderHome(); return; }
      });
      $('app').addEventListener('click', e => {
        const o = e.target.closest('.opt');
        if (o && !o.disabled) { const box = o.closest('.qbox'); box.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b === o ? 'true' : 'false')); S.answers[box.dataset.q] = o.dataset.o; return; }
        if (e.target.closest('#btn-submit')) submit();
      });
      $('app').addEventListener('input', e => { const i = e.target.closest('[data-fill]'); if (i) S.answers[i.closest('.qbox').dataset.q] = i.value; });
      $('app').addEventListener('click', e => {
        const step = e.target.closest('[data-material-week-step]');
        if (step) { const i = S.materialWeeks.indexOf(S.materialWeek), next = i + Number(step.dataset.materialWeekStep); if (S.materialWeeks[next]) { S.materialWeek = S.materialWeeks[next]; renderHome(); } return; }
        if (e.target.closest('[data-material-week-current]')) { S.materialWeek = mondayKey(new Date()); renderHome(); return; }
        const calStep = e.target.closest('[data-calendar-step]');
        if (calStep) { const [y,m] = S.calendarMonth.split('-').map(Number), next = new Date(y, m - 1 + Number(calStep.dataset.calendarStep), 1); S.calendarMonth = `${next.getFullYear()}-${pad(next.getMonth()+1)}`; S.calendarDate = ymd(next); renderHome(); return; }
        const calDay = e.target.closest('[data-calendar-day]');
        if (calDay && !calDay.disabled) { S.calendarDate = calDay.dataset.calendarDay; renderHome(); }
      });
      window.addEventListener('hashchange', route);
      const sig = () => { const d = S.data; if (!d) return ''; const n = new Date(), k = ymd(n), h = pad(n.getHours()) + ':' + pad(n.getMinutes());
        return (d.sessions || []).map(s => (s.mode === 'online' && s.date === k && h >= hm(toMin(s.start) - 15) && h < s.end ? 1 : 0) + sessState(s, n)).join(''); };
      let last = null;
      setInterval(() => { if (!S.data || $('btn-back').classList.contains('hidden') === false) return; const g = sig(); if (last === null) { last = g; return; } if (g !== last) { last = g; renderHome(); } }, 30000);
    }

    function boot() {
      icons(); bind(); S.c = LMS.client();
      if (!S.c) return showError('Không tải được thư viện kết nối. Kiểm tra mạng rồi tải lại trang.');
      route();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
  </script>
</body>
